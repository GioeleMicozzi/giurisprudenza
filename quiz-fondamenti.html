<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Quiz Fondamenti dell'argomentazione normativa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1f24; --muted:#636873; --line:#e2ded5;
  --accent:#2f5d8a; --accent-ink:#ffffff; --soft:#e9eff6;
  --ok:#1f7a4a; --ok-bg:#e3f3ea; --ko:#b23a32; --ko-bg:#f9e4e2;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171b; --card:#1f2228; --ink:#eceef2; --muted:#a2a8b3; --line:#30343c;
    --accent:#7fb0e0; --accent-ink:#0f1720; --soft:#22303f;
    --ok:#6fd19a; --ok-bg:#183527; --ko:#f08a80; --ko-bg:#3d1f1d;
  }
}
:root[data-theme="dark"]{
  --bg:#15171b; --card:#1f2228; --ink:#eceef2; --muted:#a2a8b3; --line:#30343c;
  --accent:#7fb0e0; --accent-ink:#0f1720; --soft:#22303f;
  --ok:#6fd19a; --ok-bg:#183527; --ko:#f08a80; --ko-bg:#3d1f1d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:1.45rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.modi{display:grid;gap:10px;margin-bottom:22px}
.modo{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font:inherit;cursor:pointer}
.modo:hover{border-color:var(--accent)}
.modo b{display:block;font-size:1.02rem}
.modo span{color:var(--muted);font-size:.9rem}
.modo.principale{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.modo.principale span{color:inherit;opacity:.85}
.modo[disabled]{opacity:.5;cursor:default}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
.temi{display:grid;gap:6px}
.tema{display:flex;justify-content:space-between;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;text-align:left;padding:10px 2px;cursor:pointer}
.tema:hover{color:var(--accent)}
.tema small{color:var(--muted);white-space:nowrap}
.barra{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.barra i{display:block;height:100%;background:var(--accent);transition:width .2s}
.testa{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.88rem}
.etichetta{display:inline-block;background:var(--soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600;margin-bottom:10px}
.domanda{font-size:1.15rem;font-weight:600;margin:0 0 16px;line-height:1.4}
.opzioni{display:grid;gap:9px}
.opz{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;line-height:1.4}
.opz:hover:not([disabled]){border-color:var(--accent)}
.opz .l{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:-1px}
.opz[disabled]{cursor:default}
.opz.giusta{border-color:var(--ok);background:var(--ok-bg)}
.opz.giusta .l{background:var(--ok);color:var(--card)}
.opz.sbagliata{border-color:var(--ko);background:var(--ko-bg)}
.opz.sbagliata .l{background:var(--ko);color:var(--card)}
.esito{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.95rem}
.esito.ok{background:var(--ok-bg);color:var(--ink);border-left:4px solid var(--ok)}
.esito.ko{background:var(--ko-bg);color:var(--ink);border-left:4px solid var(--ko)}
.esito b{display:block;margin-bottom:2px}
.azioni{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.punti{font-size:2.6rem;font-weight:700;margin:4px 0;letter-spacing:-.02em}
.voto{color:var(--muted);margin:0 0 14px}
.errore{border-top:1px solid var(--line);padding:12px 0}
.errore p{margin:0 0 4px}
.errore .tua{color:var(--ko)}
.errore .ok{color:var(--ok);font-weight:600}
.errore .sp{color:var(--muted);font-size:.92rem}
.nota{color:var(--muted);font-size:.85rem;margin-top:22px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

<script>
const DATI = {"materia": "Fondamenti dell'argomentazione normativa", "titolo": "Quiz di ripasso per il test", "domande": [{"tema": "L'eguaglianza: il nome di un problema", "settimana": "2026-11-20", "domanda": "L'isonomia della tradizione greco-classica è:", "giusta": "l'eguaglianza davanti alla legge, solo fra cittadini", "sbagliate": ["l'eguaglianza di tutti gli uomini davanti a Dio", "l'eguaglianza economica fra tutti gli abitanti della polis"], "spiegazione": "Dentro il cerchio della cittadinanza le differenze non rilevano; fuori restano schiavi, donne e barbari."}, {"tema": "L'eguaglianza: il nome di un problema", "settimana": "2026-11-20", "domanda": "Le prime tre tradizioni dell'eguaglianza (greca, ebraico-cristiana, giusnaturalista) danno un'eguaglianza:", "giusta": "al condizionale: sarebbero eguali davanti a Dio o nello stato di natura", "sbagliate": ["all'indicativo: gli uomini sono, nella società, liberi ed eguali", "distributivo: conta l'eguaglianza nella ricchezza"], "spiegazione": "Il passaggio all'indicativo arriva con la Rivoluzione francese."}, {"tema": "L'eguaglianza: il nome di un problema", "settimana": "2026-11-20", "domanda": "Nell'art. 3 Cost. il comma 2 (rimuovere gli ostacoli economici e sociali) esprime:", "giusta": "l'eguaglianza sostanziale, la risposta alla domanda «eguaglianza in che cosa?»", "sbagliate": ["l'eguaglianza formale davanti alla legge", "l'eguaglianza fra i soli cittadini"], "spiegazione": "Il comma 1 è l'eguaglianza formale (fra chi), il comma 2 quella sostanziale (in che cosa)."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-20", "domanda": "Secondo Melandri, applicare una distinzione per gradi a una realtà che procede per salti è:", "giusta": "sofistico", "sbagliate": ["rozzo", "sempre corretto, perché la distinzione polare è più forte"], "spiegazione": "Il contrario (distinzione per salti su realtà per gradi) è rozzo; nessuna delle due è più forte."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-20", "domanda": "Quale istituto mostra che per il diritto la capacità ha gradazioni?", "giusta": "l'amministratore di sostegno (l. 6/2004)", "sbagliate": ["l'interdizione per infermità di mente", "l'emancipazione del minore"], "spiegazione": "Con l'interdizione o c'è la capacità o non c'è; l'amministratore di sostegno introduce i gradi."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-20", "domanda": "Validità ed efficacia: quale affermazione è corretta?", "giusta": "la validità è dicotomica, l'efficacia è per gradi", "sbagliate": ["sono entrambe dicotomiche", "la validità è per gradi, l'efficacia dicotomica"], "spiegazione": "Una norma esiste o no nell'ordinamento; un divieto osservato una volta su due è efficace a metà."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-20", "domanda": "Il diritto rende dicotomico ciò che per la biologia è polare nel caso:", "giusta": "della morte: vivo o morto", "sbagliate": ["della proprietà, con Rodotà", "del dolo eventuale"], "spiegazione": "Senza il salto chi espianta organi rischierebbe l'omicidio."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-20", "domanda": "Per Raz una scelta è autonoma se ci sono:", "giusta": "capacità, assenza di coercizione e un ventaglio di opzioni", "sbagliate": ["capacità e consenso scritto", "solo l'assenza di coercizione"], "spiegazione": "Delle tre conta soprattutto il ventaglio di opzioni (il vassoio di sole arance è una costrizione architettonica)."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-20", "domanda": "Gli «encompassing groups» (Margalit e Raz) sono:", "giusta": "le formazioni intermedie la cui identità gli individui chiedono che conti", "sbagliate": ["i gruppi esclusi per legge dalla cittadinanza", "le maggioranze che governano lo Stato sovrano"], "spiegazione": "Gli individui stanno davanti allo Stato anche come membri di un gruppo: il gruppo diventa un attore."}, {"tema": "La complessificazione dell'eguaglianza", "settimana": "2026-11-20", "domanda": "Holmes e Sunstein (The Cost of Rights) mostrano che:", "giusta": "anche i diritti civili costano, non solo quelli sociali", "sbagliate": ["i diritti sociali non costano", "i diritti civili sono libertà negative senza costi"], "spiegazione": "Il voto richiede seggi e scrutatori: la differenza resta, ma non è più netta."}, {"tema": "La complessificazione dell'eguaglianza", "settimana": "2026-11-20", "domanda": "Per Waldron l'eguaglianza di base:", "giusta": "è descrittiva: gli uomini sono eguali in un senso fondamentale", "sbagliate": ["è prescrittiva: dice come trattare gli uomini", "è sempre il punto di arrivo delle pratiche"], "spiegazione": "L'eguaglianza normativa è quella prescrittiva; di solito si argomenta dalla base alla norma."}, {"tema": "La complessificazione dell'eguaglianza", "settimana": "2026-11-20", "domanda": "Una qualità «di range» è una qualità che:", "giusta": "c'è o non c'è, senza gradi (essere cittadino)", "sbagliate": ["ammette il più e il meno (intelligenza, forza)", "dipende dalla ricchezza o dal reddito"], "spiegazione": "Le qualità scalari ammettono gradi; quella di range rende irrilevanti le differenze scalari."}, {"tema": "Le tre fasi del discorso normativo", "settimana": "2026-11-20", "domanda": "Le tre fasi del discorso normativo sono, in ordine logico:", "giusta": "funzionalità, istituzioni, critica", "sbagliate": ["istituzioni, funzionalità, critica", "critica, istituzioni, funzionalità"], "spiegazione": "La successione è logica, non cronologica, con le istituzioni in mezzo."}, {"tema": "Le tre fasi del discorso normativo", "settimana": "2026-11-20", "domanda": "La regola costitutiva, a differenza di quella regolativa:", "giusta": "è condizione di esistenza dell'oggetto (il pedone degli scacchi)", "sbagliate": ["presuppone un oggetto che esiste già (il pedone della strada)", "limita soltanto la libertà"], "spiegazione": "La regola costitutiva rende possibili cose altrimenti impossibili e approfondisce la libertà."}, {"tema": "Le tre fasi del discorso normativo", "settimana": "2026-11-20", "domanda": "Il bad man di Holmes, che mette in conto la multa per parcheggiare nel posto dei disabili, è un esempio di:", "giusta": "attacco dal basso: uso tecnico dell'istituzione", "sbagliate": ["attacco dall'alto: critica per principi", "applicazione di una regola costitutiva"], "spiegazione": "La sanzione diventa un prezzo: si esce dalle credenze condivise per fini individuali."}, {"tema": "Le tre fasi del discorso normativo", "settimana": "2026-11-20", "domanda": "La riforma del diritto di famiglia del 1975 è un esempio di critica che porta a:", "giusta": "riforma, in nome di un principio immanente", "sbagliate": ["distruzione dell'istituzione, come per la schiavitù", "nessun cambiamento, per l'inerzia normativa"], "spiegazione": "La schiavitù invece è stata distrutta, non riformata."}, {"tema": "Le tre fasi del discorso normativo", "settimana": "2026-11-20", "domanda": "Il «sovversivismo dell'immanenza» (Walzer) è la critica che:", "giusta": "colpisce l'istituzione in nome dei suoi stessi valori", "sbagliate": ["usa principi religiosi", "usa il diritto naturale"], "spiegazione": "È la critica più temuta; la teoria preferisce i principi immanenti perché meno costosi filosoficamente."}, {"tema": "Il principio di rilevanza", "settimana": "2026-11-20", "domanda": "Per Dworkin i diritti sono «trumps» perché:", "giusta": "prevalgono sulle considerazioni di utilità", "sbagliate": ["si possono scambiare con altri diritti", "valgono solo se conclusivi"], "spiegazione": "Esprimono un'esigenza di giustizia e stanno con le posizioni deontologiche."}, {"tema": "Il principio di rilevanza", "settimana": "2026-11-20", "domanda": "L'argomentazione normativa poggia sul principio di:", "giusta": "rilevanza", "sbagliate": ["conclusività", "maggioranza"], "spiegazione": "La conclusività vale per il confronto tecnico fra policies; un argomento che si pensa conclusivo esce dal discorso normativo."}, {"tema": "Il principio di rilevanza", "settimana": "2026-11-20", "domanda": "Nel caso Ilva il d.l. 92/2015 è stato giudicato:", "giusta": "illegittimo: prevalgono salute e ambiente, nessun diritto può diventare «tiranno»", "sbagliate": ["legittimo, perché la produzione prevale sempre", "legittimo, perché era un decreto d'urgenza"], "spiegazione": "I diritti si integrano: nessuno può prevalere in modo assoluto."}, {"tema": "Che cos'è un'istituzione", "settimana": "2026-11-20", "domanda": "Per Searle il denaro è:", "giusta": "un fatto istituzionale", "sbagliate": ["un fatto bruto", "una regola tecnica"], "spiegazione": "Esiste solo grazie a regole e credenze condivise; una quercia è un fatto bruto."}, {"tema": "Che cos'è un'istituzione", "settimana": "2026-11-20", "domanda": "Il riferimento normativo citato per l'uso tecnico del diritto da parte di chi «mente» con le istituzioni è:", "giusta": "la frode alla legge (art. 1344 c.c.)", "sbagliate": ["la responsabilità civile (art. 2043 c.c.)", "l'analogia (art. 12 preleggi)"], "spiegazione": "Ciò che non può servire a mentire non serve a dire il vero, e il diritto lo sa."}, {"tema": "Gli argomenti normativi", "settimana": "2026-11-20", "domanda": "La «checkerboard strategy» di Dworkin sulla pena di morte è:", "giusta": "un controesempio normativo: inaccettabile per tutti", "sbagliate": ["un compromesso accettato dalle corti americane", "un argomento utilitarista sulla deterrenza"], "spiegazione": "Davanti a soluzioni estreme l'argomento si riorienta: struttura riflessiva."}, {"tema": "Gli argomenti normativi", "settimana": "2026-11-20", "domanda": "Per Bernard Williams la vergogna è un'emozione:", "giusta": "rossa: si arrossisce davanti a un altro", "sbagliate": ["bianca: la si prova anche da soli", "atomistica, come la paura"], "spiegazione": "Hobbes sceglie la paura (bianca); Vico il pudore (rossa), da cui nascono le istituzioni."}, {"tema": "I valori condivisi", "settimana": "2026-11-20", "domanda": "L'argomento del Cardinal de Retz dice che:", "giusta": "è più facile scusare chi agisce contro il decoro della professione che chi ne parla", "sbagliate": ["le azioni contano più delle parole", "i valori condivisi non cambiano mai"], "spiegazione": "Chi mette esplicitamente in discussione una norma morale la indebolisce."}, {"tema": "I valori condivisi", "settimana": "2026-11-20", "domanda": "Per Raz «il vero significato di una pratica sociale è»:", "giusta": "il suo significato sociale, il ruolo che gioca ora", "sbagliate": ["il significato originario nella cultura d'origine", "quello voluto da chi la pratica"], "spiegazione": "Anche ammesso il significato originario, in Occidente la pratica è percepita come discriminatoria."}, {"tema": "La razza", "settimana": "2026-11-20", "domanda": "La one drop rule:", "giusta": "trasforma una qualità scalare in una di range", "sbagliate": ["è un esempio di colorblindness", "è una regola dell'affirmative action"], "spiegazione": "Una sola goccia di sangue nero bastava: al servizio della supremazia bianca."}, {"tema": "L'orientamento sessuale", "settimana": "2026-11-20", "domanda": "Contro Devlin, Hart sostiene che:", "giusta": "che l'immoralità indebolisca la società non è un fatto empirico, ma un assunto a priori", "sbagliate": ["la società si disintegra senza valori condivisi", "il disgusto è un buon argomento normativo"], "spiegazione": "Sono prevalse le idee di Hart; negli USA Lawrence v. Texas (2003) chiude la questione."}, {"tema": "L'orientamento sessuale", "settimana": "2026-11-20", "domanda": "Il Don't Ask Don't Tell è un esempio del percorso in cui:", "giusta": "una diseguaglianza normativa crea una diseguaglianza di base", "sbagliate": ["l'eguaglianza di base fonda quella normativa", "la norma resta senza effetti"], "spiegazione": "Rende per legge i gay equivoci, cioè ciò che il pregiudizio pensava che fossero."}, {"tema": "La filosofia del diritto angloamericana dal 1960", "settimana": "2026-11-20", "domanda": "La regola di scelta sotto il velo di ignoranza di Rawls è:", "giusta": "il maximin: il migliore dei casi peggiori", "sbagliate": ["la massima utilità media", "l'eguaglianza assoluta"], "spiegazione": "Fra 8-2 e 8-14 si sceglie 8-14: le diseguaglianze vanno bene se avvantaggiano i più svantaggiati."}, {"tema": "L'eguaglianza alla prova dei casi", "settimana": "2026-11-20", "domanda": "In Regents of the University of California v. Bakke (1978) la Corte Suprema:", "giusta": "quote illegittime, ma la razza può essere un fattore", "sbagliate": ["vietata ogni considerazione della razza", "quote riservate legittime, Bakke respinto"], "spiegazione": "Bakke è ammesso; tutte e due le parti parlano la lingua dell'eguaglianza."}, {"tema": "L'eguaglianza alla prova dei casi", "settimana": "2026-11-20", "domanda": "Per le mutilazioni genitali femminili l'Italia ha scelto:", "giusta": "una norma ad hoc, l'art. 583-bis c.p.", "sbagliate": ["di applicare la norma esistente sulle lesioni gravissime", "di non punirle se culturalmente motivate"], "spiegazione": "È la soluzione legislativa del modello del riconoscimento (come il FGM Act 2003)."}, {"tema": "L'argomentazione filosofica: Thomson e Finnis", "settimana": "2026-11-20", "domanda": "L'esperimento del violinista è di:", "giusta": "Judith Jarvis Thomson, che assume l'embrione persona e difende l'interruzione", "sbagliate": ["John Finnis, che condanna l'interruzione", "Rawls, sotto il velo di ignoranza"], "spiegazione": "Finnis condanna l'aborto anche se l'embrione non fosse persona: la vita è un bene fondamentale."}, {"tema": "Il privilegio: l'altra faccia dell'oppressione", "settimana": "2026-11-20", "domanda": "Per l'art. 14 delle preleggi il diritto eccezionale:", "giusta": "non si applica per analogia", "sbagliate": ["si applica sempre per analogia", "vale solo per i singoli"], "spiegazione": "È l'erede del privilegium romano; l'analogia è all'art. 12."}, {"tema": "Il privilegio: l'altra faccia dell'oppressione", "settimana": "2026-11-20", "domanda": "Corte cost. 131/2022 ha stabilito:", "giusta": "il cognome di entrambi i genitori", "sbagliate": ["il solo cognome paterno", "l'adozione per i single"], "spiegazione": "Il solo cognome paterno era un privilegio a danno della madre e dell'identità del minore."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "La vulnerabilità situata, a differenza di quella antropologica:", "giusta": "nasce da diseguaglianze normative e cambia con il contesto", "sbagliate": ["riguarda tutti gli esseri umani in quanto mortali e fragili", "è una categoria metafisica, uguale in ogni contesto"], "spiegazione": "Quella antropologica è di tutti; quella situata è di figure riconoscibili (minoranze, straniero morale, migranti, persone LGBT, anziani) e varia con il contesto."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "In Filosofia della vulnerabilità la percezione dell'altro attraverso i cinque sensi:", "giusta": "non è neutrale e porta con sé riconoscimento o mancanza di riconoscimento", "sbagliate": ["è neutrale, perché i sensi registrano soltanto dati fisici", "conta solo per la vista, perché gli altri sensi non discriminano"], "spiegazione": "La logica simbolica dei sensi serve a capire come si costituisce una vulnerabilità situata."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "La logica della vista è che:", "giusta": "si può vedere senza essere visti, e vedere è controllo", "sbagliate": ["non si può vedere senza essere visti, e vedere è reciprocità", "si vede solo ciò che si ascolta, e vedere è comprendere"], "spiegazione": "L'«ossessione del colore» («ti vedo nero, ti rendo nero») mostra come la vista possa rendere vulnerabile."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "Secondo il giudice Bazile nel caso Loving, le razze non dovevano mescolarsi perché:", "giusta": "Dio le aveva poste su continenti diversi", "sbagliate": ["la Costituzione americana lo vietava espressamente", "le scienze naturali dimostravano la loro diversa origine"], "spiegazione": "È l'argomento usato per giustificare le leggi contro la miscegenation: la metafora del colore cambia il diritto."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "Lo «straniero morale» è:", "giusta": "il vicino eguale eppure diverso, con cui non si condivide più un ethos scontato", "sbagliate": ["il migrante appena arrivato, che non conosce ancora la lingua", "chi viola le regole morali della comunità e ne viene escluso"], "spiegazione": "È la figura di vulnerabilità legata all'ascolto: può essere udito, inteso, compreso, ma non ascoltato."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "Nella struttura dell'ascolto, «comprendere» significa:", "giusta": "capire perché l'altro la pensa diversamente, senza per questo condividerlo", "sbagliate": ["capire il significato delle parole che l'altro pronuncia", "adottare il punto di vista dell'altro rinunciando al proprio"], "spiegazione": "Comprendere riconosce un valore potenziale alla posizione altrui e la rispetta prima facie; intendere è capire il significato."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "La parola «stupro», che a lungo non si riferiva al marito, è un esempio di:", "giusta": "significati che divergono e cambiano dentro la stessa lingua", "sbagliate": ["parola che si traduce in modo diverso in due lingue", "parola che il diritto penale ha sempre definito allo stesso modo"], "spiegazione": "Il problema dell'intendere c'è anche dentro una stessa lingua; il nuovo significato è entrato anche nel linguaggio giuridico."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "Perché l'olfatto è un senso a cui non si può sottrarsi?", "giusta": "perché l'organo che fa odorare è lo stesso che fa respirare", "sbagliate": ["perché gli odori si sentono da distanze maggiori dei suoni", "perché l'odore si può scegliere e controllare come la voce"], "spiegazione": "La quarta scimmietta, quella che si tappa il naso, non c'è: e il proprio odore emana senza volerlo."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "Il fastidio per l'«odore» dell'altro si gioca soprattutto:", "giusta": "sul contesto della motivazione, e per questo si autovalida", "sbagliate": ["sul contesto dell'argomentazione, e si confuta con un buon argomento", "sulle norme giuridiche, che lo vietano espressamente"], "spiegazione": "Non è un argomento: per questo l'indignazione da sola è ingenua e servono prossimità e conoscenza reciproca."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "Davanti al protestante contrario al divorzio perché traumatizzato dal divorzio dei genitori, il discorso normativo chiede di:", "giusta": "discutere la sua argomentazione, non la sua motivazione", "sbagliate": ["confutarlo mostrando che la sua tesi nasce dal trauma", "non discutere affatto, perché la sua posizione è irrazionale"], "spiegazione": "Impugnare la motivazione è offensivo: «perché non confuti il mio discorso?» (Platone, Repubblica 349a)."}, {"tema": "I valori condivisi", "settimana": "2026-11-22", "domanda": "Nell'Inferno di Dante, Semiramide «libito fé licito in sua legge»: cioè:", "giusta": "usò il diritto in modo tecnico per rendere lecito ciò che le piaceva", "sbagliate": ["fu condannata dalla legge per aver ceduto alla passione", "scrisse un testo che rese affascinante l'adulterio"], "spiegazione": "È un uso tecnico del diritto; per Paolo e Francesca invece il colpevole è un testo («Galeotto fu 'l libro»)."}, {"tema": "I valori condivisi", "settimana": "2026-11-22", "domanda": "I club inglesi per soli uomini diventano discriminatori:", "giusta": "quando le donne chiedono di entrare e il club risponde di no", "sbagliate": ["dal momento in cui vengono fondati, perché escludono le donne", "solo quando una legge li dichiara discriminatori"], "spiegazione": "Prima nessuno voleva entrarci; con la richiesta nuova il «no» costruisce muri che prima non c'erano: cambia il significato sociale."}, {"tema": "I valori condivisi", "settimana": "2026-11-22", "domanda": "Secondo Ratzinger, il diritto:", "giusta": "può modificare la morale comune, per il suo valore simbolico ed espressivo", "sbagliate": ["non può mai modificare la morale, che viene prima del diritto", "modifica soltanto la morale cattolica, non quella comune"], "spiegazione": "Esempio: l'abolizione del delitto d'onore (art. 587 c.p., abrogato dalla l. 442/1981); è l'argomento di de Retz."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "Per Zanetti le pratiche di eguaglianza normativa producono:", "giusta": "un'aequalitas aequans, una serie continua di terapie, mai un'aequalitas aequata", "sbagliate": ["un'aequalitas aequata, l'eguaglianza perfetta raggiunta una volta per tutte", "nessun effetto, perché la vulnerabilità situata è un dato naturale"], "spiegazione": "Gli argomenti si basano sul principio di rilevanza e la struttura del discorso normativo resta aperta: l'eguaglianza perfetta non arriva mai."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "Hart, immaginando esseri umani simili a granchi corazzati, illustra:", "giusta": "la vulnerabilità antropologica, che ha influenzato la riflessione giuridica", "sbagliate": ["la vulnerabilità situata, generata da diseguaglianze normative", "lo straniero morale, che non viene ascoltato"], "spiegazione": "Se non potessimo essere feriti, il diritto sarebbe tutt'altro: è la vulnerabilità di tutti, vera ma un po' banale."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "Il tatto si distingue dalla vista e dall'udito perché:", "giusta": "non si può toccare senza essere toccati: è il senso della reciprocità e della cura", "sbagliate": ["si può toccare senza essere toccati, come si vede senza essere visti", "è l'unico senso che non porta con sé riconoscimento"], "spiegazione": "Si vede senza essere visti (il panopticon) e si ode senza essere uditi; il tatto è reciproco. Vi si lega la vulnerabilità di disabili e anziani."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "Nella vulnerabilità delle persone disabili:", "giusta": "la differenza fra disabile e grande disabile è maggiore di quella fra disabile e non disabile", "sbagliate": ["la differenza fra disabile e non disabile è sempre la più grande", "tutti i disabili hanno le stesse esigenze e vanno trattati allo stesso modo"], "spiegazione": "Chi ha una disabilità leggera vuole l'integrazione, chi ha una disabilità grave può volere una classe speciale: ogni vulnerabilità ha una specificità unica."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "Davanti a un argomento, il discorso normativo consente di rispondere:", "giusta": "confutandolo, cioè mostrandone l'errore, o contestandone la rilevanza", "sbagliate": ["confutandolo o mostrando che la motivazione di chi lo propone è inconfessabile", "soltanto contestandone la rilevanza, mai i dati su cui si basa"], "spiegazione": "Impugnare la motivazione non è ammesso: restano i due modi, l'errore dentro l'argomento o la sua rilevanza."}, {"tema": "La vulnerabilità e i cinque sensi", "settimana": "2026-11-22", "domanda": "L'argomento «trattare in modo uguale i casi uguali», usato in Senato contro il riconoscimento federale dei matrimoni fra persone dello stesso sesso, mostra che:", "giusta": "motivazione e argomentazione hanno solo una relativa autonomia: l'omofobia dei verbali gli toglie forza", "sbagliate": ["motivazione e argomentazione sono sempre del tutto separate, quindi l'argomento resta intatto", "un argomento tecnico non può mai essere contestato sul piano della rilevanza"], "spiegazione": "Di solito l'argomento si discute da solo, ma quando i fattori motivazionali emergono così chiaramente ne indeboliscono il prestigio."}, {"tema": "L'orientamento sessuale", "settimana": "2026-11-22", "domanda": "Romer v. Evans (1996) riguarda:", "giusta": "il Colorado Amendment 2, con la deposizione di filosofi del diritto come Finnis e George", "sbagliate": ["il divieto di servizio militare per le persone gay, il caso Steffan", "il matrimonio interrazziale in Virginia, deciso dalla Corte Suprema nel 1967"], "spiegazione": "Il docente lo consiglia per vedere le cross-examinations: la regola è rispondere con il minimo numero di parole."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-25", "domanda": "Chi ha ripreso la distinzione tra opposizione dicotomica e opposizione polare?", "giusta": "Enzo Melandri", "sbagliate": ["Jeremy Waldron", "Ludwig Wittgenstein"], "spiegazione": "Melandri la riprende nel corso di Filosofia dell'a.a. 1979-1980.", "fonte": "dispensa F.A.N."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-25", "domanda": "La dicotomia opera secondo:", "giusta": "una logica binaria in cui tertium non datur", "sbagliate": ["una logica per gradi con passaggi intermedi", "una scala continua di intensità"], "spiegazione": "Dicotomia: o in un modo o nell'altro, senza sfumature; l'opposizione polare ammette gradi intermedi.", "fonte": "dispensa F.A.N."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-25", "domanda": "Per Waldron una proprietà di range è:", "giusta": "una proprietà binaria che sopravviene su una proprietà scalare", "sbagliate": ["una proprietà che si possiede in misura variabile", "una proprietà che vale solo per i cittadini americani"], "spiegazione": "Range: si è così o no (es. essere cittadini del New Jersey), anche se la base è scalare.", "fonte": "dispensa F.A.N."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-25", "domanda": "Nell'esempio di Waldron, essere cittadini del New Jersey è una proprietà:", "giusta": "di range: conta solo stare dentro i confini", "sbagliate": ["scalare: conta la distanza da Trenton", "polare: si è più o meno cittadini"], "spiegazione": "Jersey City, Trenton o il confine con New York non contano: o si è dentro o no.", "fonte": "dispensa F.A.N."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-25", "domanda": "Il declassamento di Plutone è citato come esempio di:", "giusta": "blurring the line: una distinzione meno netta", "sbagliate": ["dicotomia rafforzata dalla scienza", "proprietà di range in astronomia"], "spiegazione": "Dopo il voto sullo status di Plutone la distinzione tra pianeti e asteroidi appare meno netta.", "fonte": "dispensa F.A.N."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-25", "domanda": "Nel diritto, un esempio di attenuazione della rigidità binaria fra capace e incapace è:", "giusta": "l'amministratore di sostegno", "sbagliate": ["l'interdizione giudiziale", "la maggiore età a 18 anni"], "spiegazione": "L'amministratore di sostegno adotta un approccio più inclusivo della dicotomia capace/incapace.", "fonte": "dispensa F.A.N."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-25", "domanda": "Rottleuthner osserva che l'adulterio:", "giusta": "non è reato ma non è giuridicamente irrilevante", "sbagliate": ["è reato ma non rileva nel divorzio", "è irrilevante per ogni ramo del diritto"], "spiegazione": "Di fronte alla dicotomia legale/illegale di Luhmann, l'adulterio rileva per esempio nel divorzio.", "fonte": "dispensa F.A.N."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-25", "domanda": "Chi ha definito il diritto «mite»?", "giusta": "Gustavo Zagrebelsky", "sbagliate": ["Jean Carbonnier", "Stefano Rodotà"], "spiegazione": "Mite (Zagrebelsky), flessibile (Carbonnier), a bassa intensità (Rodotà).", "fonte": "dispensa F.A.N."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-25", "domanda": "In Principia iuris di Luigi Ferrajoli, effettività e legittimità sono opposizioni:", "giusta": "polari, espresse come «grado»", "sbagliate": ["dicotomiche, come validità/invalidità", "irrilevanti per il diritto"], "spiegazione": "Ferrajoli distingue dicotomie (permesso/vietato, valido/invalido) e opposizioni polari di grado.", "fonte": "dispensa F.A.N."}, {"tema": "Dicotomie e distinzioni per gradi", "settimana": "2026-11-25", "domanda": "La validità di una norma è considerata:", "giusta": "dicotomica: la norma esiste o no nell'ordinamento", "sbagliate": ["polare: più o meno valida", "dipendente solo dall'osservanza sociale"], "spiegazione": "Validità: appartenenza all'ordinamento (dicotomia); effettività: osservanza (polare).", "fonte": "dispensa F.A.N."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-25", "domanda": "I tre requisiti classici dell'autonomia richiamati con Appiah sono:", "giusta": "capacità di intendere e volere, assenza di coercizione, disponibilità di opzioni", "sbagliate": ["libertà di stampa, di culto e di associazione", "capacità di intendere e volere, ricchezza, istruzione"], "spiegazione": "Il nuovo orientamento enfatizza soprattutto la disponibilità di opzioni significative.", "fonte": "dispensa F.A.N."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-25", "domanda": "L'esempio del cesto di frutta (solo arance) mostra che l'autonomia richiede:", "giusta": "un ventaglio di opzioni diversificate", "sbagliate": ["l'assenza di qualsiasi scelta", "che le arance non siano marce"], "spiegazione": "Con un vassoio di frutti diversi, scegliere l'arancia è prova di libertà.", "fonte": "dispensa F.A.N."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-25", "domanda": "L'imperativo «Agisci in modo da aumentare il numero delle possibilità» è di:", "giusta": "Heinz von Foerster", "sbagliate": ["Immanuel Kant", "John Stuart Mill"], "spiegazione": "L'imperativo etico di von Foerster lega l'azione autonoma alle opzioni rese possibili dal diritto.", "fonte": "dispensa F.A.N."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-25", "domanda": "Per Hobbes il diritto è soprattutto:", "giusta": "regola regolativa che limita la libertà per l'ordine", "sbagliate": ["regola costitutiva che crea nuove opzioni", "conflitto sociale fra gruppi"], "spiegazione": "Fine: pax est quaerenda; atteggiamento ostile al pluralismo.", "fonte": "dispensa F.A.N."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-25", "domanda": "Per Vico il diritto, come regola costitutiva, porta:", "giusta": "all'ingentilimento delle nazioni attraverso il conflitto sociale", "sbagliate": ["all'eliminazione del pluralismo", "al ritorno allo stato di natura"], "spiegazione": "Vico presuppone il pluralismo; il matrimonio supera la venere vaga.", "fonte": "dispensa F.A.N."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-25", "domanda": "«Un po' più di Vico e un po' meno di Hobbes» indica:", "giusta": "un diritto mite e flessibile che presuppone il pluralismo", "sbagliate": ["un diritto più severo e repressivo", "un ritorno allo Stato assoluto"], "spiegazione": "È la formula dell'autocomprensione giuridica legata a mitezza e flessibilità.", "fonte": "dispensa F.A.N."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-25", "domanda": "Il diritto di exit e il diritto al ripensamento servono a:", "giusta": "preservare le opzioni disponibili", "sbagliate": ["obbligare a scegliere una volta per tutte", "eliminare le opzioni rischiose"], "spiegazione": "Senza exit una scelta libera può ridurre l'autonomia riducendo le opzioni.", "fonte": "dispensa F.A.N."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-25", "domanda": "Con l'«inversione dell'onere della prova», opzioni e gruppi comprensivi:", "giusta": "appaiono in linea di principio dotati di valore", "sbagliate": ["vanno provati di valore prima di essere ammessi", "sono tutti di eguale valore assoluto"], "spiegazione": "Per negarne il valore serve un argomento critico; ma non tutti hanno egual valore (es. gruppi antisemiti).", "fonte": "dispensa F.A.N."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-25", "domanda": "Il diritto successorio del maso chiuso in Sud Tirolo è un esempio di legislazione:", "giusta": "group conscious", "sbagliate": ["colorblind", "puramente individualista"], "spiegazione": "In Italia esistevano esempi di legislazione group conscious prima del multiculturalismo.", "fonte": "dispensa F.A.N."}, {"tema": "L'autonomia dell'individuo", "settimana": "2026-11-25", "domanda": "La politike philia richiamata dall'Etica Nicomachea è:", "giusta": "l'amicizia politica o concordia (homonoia)", "sbagliate": ["la paura della morte nello stato di natura", "l'amore per la propria famiglia"], "spiegazione": "Richiamata per il pluralismo normativo dei gruppi comprensivi.", "fonte": "dispensa F.A.N."}, {"tema": "L'eguaglianza: il nome di un problema", "settimana": "2026-11-25", "domanda": "Nella tradizione ebraico-cristiana gli uomini sono eguali:", "giusta": "di fronte a Dio, davanti a cui le differenze diventano irrilevanti", "sbagliate": ["di fronte alla legge, solo se cittadini", "per contratto sociale fra individui liberi"], "spiegazione": "Confrontandosi con un Dio trascendente e perfetto le differenze perdono rilievo.", "fonte": "dispensa F.A.N."}, {"tema": "L'eguaglianza: il nome di un problema", "settimana": "2026-11-25", "domanda": "La quarta tradizione dell'eguaglianza è quella:", "giusta": "egualitaria/rivoluzionaria (es. Marx)", "sbagliate": ["del contratto sociale", "greca dell'isonomia"], "spiegazione": "Eguaglianza attiva che cambia la società in modo radicale.", "fonte": "dispensa F.A.N."}, {"tema": "La complessificazione dell'eguaglianza", "settimana": "2026-11-25", "domanda": "Secondo lo schema classico, i diritti civili sono legati:", "giusta": "all'eguaglianza di fronte alla const D = DATI.domande.map(d=>({...d,id:d.domanda}));
const PER_ID = Object.fromEntries(D.map(d=>[d.id,d]));
const ULTIMA = D.map(d=>d.settimana||"").sort().pop()||"";
const NUOVE = ULTIMA?D.filter(d=>d.settimana===ULTIMA):[];
const TEMI = [...new Set(D.map(d=>d.tema))];
const CHIAVE = "quiz-fondamenti-errori";
const app = document.getElementById("app");
let giro = null;

function leggiErrori(){ try{ return JSON.parse(localStorage.getItem(CHIAVE)||"[]"); }catch(e){ return []; } }
function scriviErrori(a){ try{ localStorage.setItem(CHIAVE, JSON.stringify(a)); }catch(e){} }
function mescola(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function home(){
  giro = null;
  const err = leggiErrori().filter(id=>PER_ID[id]);
  app.innerHTML = `
    <h1>${esc(DATI.materia)}</h1>
    <p class="sub">${esc(DATI.titolo)}: ${D.length} domande a risposta chiusa prese dal riassunto. Dopo ogni risposta vedi quella giusta e il perché.</p>
    <div class="modi">
      <button class="modo principale" data-m="sim"><div><b>Simulazione</b><span>30 domande a caso da tutti gli argomenti</span></div><span>→</span></button>
      ${NUOVE.length && NUOVE.length<D.length?`<button class="modo" data-m="nuove"><div><b>Questa settimana</b><span>le domande aggiunte il ${esc(ULTIMA.split("-").reverse().join("/"))}</span></div><span>${NUOVE.length}</span></button>`:""}
      <button class="modo" data-m="tutte"><div><b>Tutte le domande</b><span>in ordine casuale</span></div><span>${D.length}</span></button>
      <button class="modo" data-m="err" ${err.length?"":"disabled"}><div><b>Ripassa gli errori</b><span>${err.length?"le domande sbagliate finora":"ancora nessun errore salvato"}</span></div><span>${err.length||""}</span></button>
    </div>
    <h2>Per argomento</h2>
    <div class="temi">${TEMI.map((t,i)=>`<button class="tema" data-t="${i}"><span>${esc(t)}</span><small>${D.filter(d=>d.tema===t).length} domande</small></button>`).join("")}</div>`;
  app.querySelectorAll(".modo").forEach(b=>b.onclick=()=>{
    const m=b.dataset.m;
    if(m==="sim") inizia(mescola(D).slice(0,30),"Simulazione");
    if(m==="tutte") inizia(mescola(D),"Tutte le domande");
    if(m==="nuove") inizia(mescola(NUOVE),"Questa settimana");
    if(m==="err") inizia(mescola(leggiErrori().filter(id=>PER_ID[id]).map(id=>PER_ID[id])),"Ripasso degli errori");
  });
  app.querySelectorAll(".tema").forEach(b=>b.onclick=()=>{ const t=TEMI[+b.dataset.t]; inizia(mescola(D.filter(d=>d.tema===t)),t); });
  window.scrollTo(0,0);
}

function inizia(lista,nome){
  giro = {lista:lista.map(d=>({d,opz:mescola([d.giusta,...d.sbagliate])})), nome, i:0, giuste:0, sbagliate:[]};
  mostra();
}

function mostra(){
  const g=giro, q=g.lista[g.i], n=g.lista.length;
  app.innerHTML = `
    <div class="testa"><span>${esc(g.nome)}</span><span>${g.i+1} / ${n} · ${g.giuste} giuste</span></div>
    <div class="barra"><i style="width:${(g.i)/n*100}%"></i></div>
    <div class="card">
      <span class="etichetta">${esc(q.d.tema)}</span>
      <p class="domanda">${esc(q.d.domanda)}</p>
      <div class="opzioni">${q.opz.map((o,k)=>`<button class="opz" data-k="${k}"><span class="l">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="esito"></div>
    </div>
    <div class="azioni"><button class="btn sec" id="esci">Torna all'inizio</button><span></span></div>`;
  app.querySelectorAll(".opz").forEach(b=>b.onclick=()=>rispondi(+b.dataset.k));
  document.getElementById("esci").onclick=home;
  window.scrollTo(0,0);
}

function rispondi(k){
  const g=giro, q=g.lista[g.i];
  if(q.data!==undefined) return;
  q.data=k;
  const scelta=q.opz[k], ok=scelta===q.d.giusta;
  const err=new Set(leggiErrori());
  if(ok){ g.giuste++; err.delete(q.d.id); } else { g.sbagliate.push({q,scelta}); err.add(q.d.id); }
  scriviErrori([...err]);
  app.querySelectorAll(".opz").forEach(b=>{
    b.disabled=true; const o=q.opz[+b.dataset.k];
    if(o===q.d.giusta) b.classList.add("giusta"); else if(+b.dataset.k===k) b.classList.add("sbagliata");
  });
  const sp=q.d.spiegazione?`<div>${esc(q.d.spiegazione)}</div>`:"";
  document.getElementById("esito").innerHTML = ok
    ? `<div class="esito ok"><b>Giusto</b>${sp}</div>`
    : `<div class="esito ko"><b>Sbagliato. Era: ${esc(q.d.giusta)}</b>${sp}</div>`;
  const ultima=g.i===g.lista.length-1;
  const az=app.querySelector(".azioni span");
  az.outerHTML=`<button class="btn" id="avanti">${ultima?"Vedi il risultato":"Avanti →"}</button>`;
  document.getElementById("avanti").onclick=()=>{ if(ultima) fine(); else { g.i++; mostra(); } };
  document.getElementById("avanti").focus({preventScroll:true});
  app.querySelector(".testa span:last-child").textContent=`${g.i+1} / ${g.lista.length} · ${g.giuste} giuste`;
}

function fine(){
  const g=giro, n=g.lista.length, pct=Math.round(g.giuste/n*100);
  const giudizio = pct>=90?"Ottimo.":pct>=75?"Buono: ripassa le poche sbagliate.":pct>=60?"Sufficiente: guarda bene gli errori qui sotto.":"Da ripassare: rileggi gli argomenti delle domande sbagliate.";
  app.innerHTML = `
    <div class="card">
      <div class="testa"><span>${esc(g.nome)}</span><span>finito</span></div>
      <div class="punti">${g.giuste} / ${n}</div>
      <p class="voto">${pct}% di risposte giuste. ${giudizio}</p>
      ${g.sbagliate.length?`<h2>Le domande sbagliate</h2>`+g.sbagliate.map(({q,scelta})=>`
        <div class="errore"><p><b>${esc(q.d.domanda)}</b></p>
        <p class="tua">Hai risposto: ${esc(scelta)}</p>
        <p class="ok">Giusta: ${esc(q.d.giusta)}</p>
        ${q.d.spiegazione?`<p class="sp">${esc(q.d.spiegazione)}</p>`:""}</div>`).join(""):""}
    </div>
    <div class="azioni">
      <button class="btn sec" id="casa">Torna all'inizio</button>
      ${g.sbagliate.length?`<button class="btn" id="rifai">Rifai le sbagliate</button>`:`<button class="btn" id="nuova">Nuova simulazione</button>`}
    </div>`;
  document.getElementById("casa").onclick=home;
  const r=document.getElementById("rifai"); if(r) r.onclick=()=>inizia(mescola(g.sbagliate.map(s=>s.q.d)),"Rifai le sbagliate");
  const nu=document.getElementById("nuova"); if(nu) nu.onclick=()=>inizia(mescola(D).slice(0,30),"Simulazione");
  window.scrollTo(0,0);
}

document.addEventListener("keydown",e=>{
  if(!giro||!app.querySelector(".opz")) return;
  const k="1234".indexOf(e.key), kl="abcd".indexOf(e.key.toLowerCase());
  const q=giro.lista[giro.i];
  if(q && q.data===undefined && (k>=0||kl>=0)){ rispondi(k>=0?k:kl); e.preventDefault(); }
  else if(e.key==="Enter"){ const a=document.getElementById("avanti"); if(a){ a.click(); e.preventDefault(); } }
});

home();
</script>
</body>
</html>
