<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giurisprudenza</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --sfondo: var(--tg-theme-secondary-bg-color, #f1f2f6);
    --carta: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --testo: var(--tg-theme-text-color, #16181d);
    --tenue: var(--tg-theme-hint-color, #7d8592);
    --accento: var(--tg-theme-button-color, #2f6fde);
    --su-accento: var(--tg-theme-button-text-color, #ffffff);
    --linea: color-mix(in srgb, var(--tenue) 22%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg]) { --sfondo: #101215; --carta: #1b1e23; --testo: #eceef2; --tenue: #8b93a1; --accento: #5b93f0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sfondo); color: var(--testo);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 32px; }
  header { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .indietro { border: 0; background: none; color: var(--accento); font-size: 16px; padding: 8px 4px; cursor: pointer; }
  .percorso { color: var(--tenue); font-size: 13px; margin: 0 0 10px; min-height: 18px; }
  input[type=search] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--linea);
                       background: var(--carta); color: var(--testo); font-size: 16px; margin-bottom: 12px; }
  .elenco { background: var(--carta); border-radius: 12px; overflow: hidden; }
  .voce { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 14px;
          border: 0; border-top: 1px solid var(--linea); background: none; color: inherit; font: inherit; cursor: pointer; }
  .voce:first-child { border-top: 0; }
  .voce:active { background: var(--linea); }
  .emoji { font-size: 22px; width: 28px; text-align: center; flex: none; }
  .corpo { flex: 1; min-width: 0; }
  .titolo { overflow: hidden; text-overflow: ellipsis; }
  .sotto { color: var(--tenue); font-size: 13px; }
  .conta { color: var(--tenue); font-size: 14px; flex: none; }
  .freccia { color: var(--tenue); flex: none; }
  .vuoto { padding: 18px 14px; color: var(--tenue); text-align: center; }
  .piede { color: var(--tenue); font-size: 12px; text-align: center; margin-top: 16px; }
  .titoletto { color: var(--tenue); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 18px 4px 6px; }
  .scheda { padding: 13px 14px; border-top: 1px solid var(--linea); }
  .scheda:first-child { border-top: 0; }
  .scheda h3 { margin: 0 0 8px; font-size: 16px; }
  .righe { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 14px; margin-top: 10px; }
  .righe dt { color: var(--tenue); } .righe dd { margin: 0; }
  .sett { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .g { border: 1px solid var(--linea); border-radius: 8px; padding: 5px 0 6px; text-align: center; font-size: 12px;
       color: var(--tenue); display: grid; gap: 4px; justify-items: center; }
  .g b { color: var(--testo); font-weight: 600; font-size: 12px; }
  .g i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--linea); }
  .g.fatta i { background: var(--testo); border-color: var(--testo); }
  .g.incorso i { background: linear-gradient(90deg, var(--testo) 50%, transparent 50%); border-color: var(--testo); }
  .g.prevista i { border-style: dashed; border-color: var(--testo); }
  .g.rev { border-color: #c79a3a; background: color-mix(in srgb, #c79a3a 16%, transparent); }
  .g.rev.fatta i, .g.rev.incorso i { background: #c79a3a; border-color: #c79a3a; }
  .g.rev.prevista i { border-color: #c79a3a; }
  .g.oggi { box-shadow: inset 0 -2px 0 var(--testo); }
  .pallino { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .p-err { background: #d0453a; } .p-warn { background: #d79b22; } .p-info { background: #4f7fc0; }
  .legenda { color: var(--tenue); font-size: 12px; margin: 6px 4px 0; }
  .sezione-link { display: block; text-align: center; margin-top: 12px; color: var(--accento); text-decoration: none; font-size: 15px; }
</style>
</head>
<body>
<main>
  <header>
    <button class="indietro" id="indietro" hidden>‹ Indietro</button>
    <h1 id="titolo">Giurisprudenza</h1>
  </header>
  <p class="percorso" id="percorso"></p>
  <input type="search" id="cerca" placeholder="Cerca un file in tutte le materie" autocomplete="off">
  <div class="elenco" id="elenco"><div class="vuoto">Carico…</div></div>
  <div id="extra"></div>
  <p class="piede" id="piede"></p>
</main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg && tg.initData !== undefined) { document.documentElement.dataset.tg = ""; tg.ready(); tg.expand(); }

let dati = null;
const pila = [];                       // dove sono: [] anni, [anno], [anno, materia], [anno, materia, tipo]
const $ = id => document.getElementById(id);

function apri(link) {
  if (tg && tg.openTelegramLink) { try { tg.openTelegramLink(link); return; } catch (e) {} }
  location.href = link;
}

function voce({ emoji = "", titolo, sotto = "", conta = "", freccia = true, azione }) {
  const b = document.createElement("button");
  b.className = "voce";
  b.innerHTML = `<span class="emoji">${emoji}</span><span class="corpo"><div class="titolo"></div>` +
    (sotto ? `<div class="sotto"></div>` : "") + `</span>` +
    (conta !== "" ? `<span class="conta">${conta}</span>` : "") + (freccia ? `<span class="freccia">›</span>` : "");
  b.querySelector(".titolo").textContent = titolo;
  if (sotto) b.querySelector(".sotto").textContent = sotto;
  b.onclick = azione;
  return b;
}

const giorno = d => d ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "";
const tipo = t => dati.tipi.find(x => x.tipo === t) || { emoji: "📄", nome: t };

function vai(...passo) { pila.push(...passo); disegna(); }
function su() { pila.pop(); disegna(); }

function disegna() {
  const elenco = $("elenco"), extra = $("extra");
  elenco.innerHTML = ""; extra.innerHTML = "";
  $("cerca").hidden = false;
  if (dati) $("piede").textContent = "Aggiornato il " + dati.aggiornato + " · i file si aprono nel gruppo Telegram";
  const cerca = $("cerca").value.trim().toLowerCase();
  const [anno, nome, t] = pila;
  $("indietro").hidden = pila.length === 0 || !!cerca;
  if (tg && tg.BackButton) pila.length && !cerca ? tg.BackButton.show() : tg.BackButton.hide();
  $("percorso").textContent = cerca ? "Risultati della ricerca" : pila.map(p => p in tipiPerNome ? tipiPerNome[p] : p).join(" › ");
  const aggiungi = el => elenco.appendChild(el);

  if (cerca) {
    $("titolo").textContent = "Cerca";
    const trovati = [];
    for (const m of dati.materie) for (const f of m.file)
      if ((f.titolo + " " + m.nome + " " + tipo(f.tipo).nome).toLowerCase().includes(cerca)) trovati.push([m, f]);
    trovati.slice(0, 100).forEach(([m, f]) => aggiungi(voce({ emoji: tipo(f.tipo).emoji, titolo: f.titolo,
      sotto: `${m.nome} · ${tipo(f.tipo).nome}`, freccia: false, azione: () => apri(f.link) })));
    if (!trovati.length) elenco.innerHTML = `<div class="vuoto">Nessun file trovato</div>`;
    return;
  }

  if (anno === PANNELLO) { disegnaPannello(elenco, extra); return; }

  if (!anno) {
    $("titolo").textContent = "Giurisprudenza";
    if (pannello) {
      const n = pannello.da_guardare.length;
      aggiungi(voce({ emoji: "📊", titolo: "Pannello dello studio", sotto: `routine: ${pannello.routine}` +
        (n ? ` · ${n} ${n === 1 ? "cosa" : "cose"} da guardare` : " · tutto in pari"), azione: () => vai(PANNELLO) }));
    }
    const anni = [...new Set(dati.materie.map(m => m.anno))];
    anni.forEach(a => {
      const ms = dati.materie.filter(m => m.anno === a);
      const n = ms.reduce((s, m) => s + m.file.length, 0);
      aggiungi(voce({ emoji: "🎓", titolo: a, sotto: `${ms.length} materie`, conta: n || "", azione: () => vai(a) }));
    });
    return;
  }

  if (!nome) {
    $("titolo").textContent = anno;
    dati.materie.filter(m => m.anno === anno).forEach(m =>
      aggiungi(voce({ emoji: "📘", titolo: m.nome, sotto: m.file.length ? `${m.file.length} file` : "Ancora vuota",
                      azione: () => vai(m.nome) })));
    return;
  }

  const materia = dati.materie.find(m => m.nome === nome);
  if (!t) {
    $("titolo").textContent = nome;
    dati.tipi.forEach(x => {
      const n = materia.file.filter(f => f.tipo === x.tipo).length;
      aggiungi(voce({ emoji: x.emoji, titolo: x.nome, conta: n, azione: () => vai(x.tipo) }));
    });
    const a = document.createElement("a");
    a.className = "sezione-link"; a.href = materia.link; a.textContent = "Apri la sezione della materia nel gruppo";
    a.onclick = e => { e.preventDefault(); apri(materia.link); };
    extra.appendChild(a);
    return;
  }

  $("titolo").textContent = tipo(t).nome;
  const file = materia.file.filter(f => f.tipo === t);
  file.forEach(f => aggiungi(voce({ emoji: tipo(t).emoji, titolo: f.titolo.replace(/^\d\d\/\d\d · /, ""), sotto: giorno(f.data),
                                    freccia: false, azione: () => apri(f.link) })));
  if (!file.length) elenco.innerHTML = `<div class="vuoto">Ancora nessun file</div>`;
}

// ---- Pannello dello studio (pannello.json, lo scrive pannello.py ogni volta che cambia qualcosa)
const PANNELLO = "Pannello dello studio";
let pannello = null;
const GG = ["Lun", "Mar", "Mer", "Gio", "Ven"];
const MESI = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
const breve = s => `${+s.slice(8, 10)} ${MESI[+s.slice(5, 7) - 1]}`;
const oggiIso = () => { const x = new Date(); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; };
const traGiorni = s => Math.round((new Date(s + "T00:00") - new Date(oggiIso() + "T00:00")) / 864e5);
const testo = (tag, cls, t) => { const el = document.createElement(tag); if (cls) el.className = cls; el.textContent = t; return el; };

function disegnaPannello(elenco, extra) {
  $("titolo").textContent = PANNELLO;
  $("cerca").hidden = true;
  const P = pannello;
  elenco.appendChild(voce({ emoji: "⚙️", titolo: "Routine", sotto: P.routine, freccia: false, azione: () => {} }));
  const es = P.esami.filter(x => traGiorni(x.data) >= 0)[0];
  if (es) { const g = traGiorni(es.data);
    elenco.appendChild(voce({ emoji: "🗓", titolo: `Prossimo esame: ${g === 0 ? "oggi" : `tra ${g} giorni`}`,
      sotto: `${es.materia} · ${breve(es.data)}`, freccia: false, azione: () => {} })); }

  extra.appendChild(testo("div", "titoletto", "Da guardare"));
  const dg = document.createElement("div"); dg.className = "elenco";
  if (!P.da_guardare.length) dg.innerHTML = `<div class="vuoto">Tutto in pari</div>`;
  P.da_guardare.forEach(v => {
    const b = voce({ titolo: v.titolo, sotto: v.sotto, freccia: false, azione: () => {} });
    b.querySelector(".emoji").innerHTML = `<span class="pallino p-${v.classe}" style="display:inline-block"></span>`;
    dg.appendChild(b);
  });
  extra.appendChild(dg);

  extra.appendChild(testo("div", "titoletto", "Materie · questa settimana"));
  const cls = { "fatta": "fatta", "in corso": "incorso", "prevista": "prevista" };
  const ms = document.createElement("div"); ms.className = "elenco";
  const oggi = oggiIso();
  P.materie.forEach(m => {
    const s = document.createElement("div"); s.className = "scheda";
    s.appendChild(testo("h3", "", m.nome));
    const sett = document.createElement("div"); sett.className = "sett";
    m.giorni.forEach((g, i) => {
      const c = document.createElement("div");
      c.className = `g ${cls[g.lezione] || ""} ${g.revisione ? "rev" : ""} ${g.data === oggi ? "oggi" : ""}`;
      c.appendChild(testo("b", "", `${GG[i]} ${+g.data.slice(8, 10)}`)); c.appendChild(document.createElement("i"));
      sett.appendChild(c);
    });
    s.appendChild(sett);
    const dl = document.createElement("dl"); dl.className = "righe";
    const riga = (k, v) => { if (v === null || v === undefined || v === "") return; dl.appendChild(testo("dt", "", k)); dl.appendChild(testo("dd", "", v)); };
    riga("Lezioni", `${m.completate} fatte` + (m.ultima ? ` · ultima ${breve(m.ultima)}` : "") +
                    (m.da_lavorare ? ` · ${m.da_lavorare} da lavorare` : ""));
    riga("Revisione", m.revisione);
    if (m.esame) { const g = traGiorni(m.esame); riga("Esame", `${breve(m.esame)} · ${g === 0 ? "oggi" : `tra ${g} giorni`}`); }
    if (m.pdf_pagine) riga("Riassunto", `${m.pdf_pagine} pagine`);
    if (m.norme) riga("Norme", `${m.norme[0]}/${m.norme[1]} controllate`);
    if (m.quiz) riga("Quiz", `${m.quiz} domande`);
    s.appendChild(dl);
    ms.appendChild(s);
  });
  extra.appendChild(ms);
  extra.appendChild(testo("p", "legenda", "Pallino pieno = lezione lavorata, mezzo = da lavorare, tratteggiato = prevista; in oro il giorno della revisione completa. Si guarda soltanto: i pulsanti sono nel pannello sul Mac."));
  $("piede").textContent = "Pannello aggiornato il " + P.aggiornato;
}

let tipiPerNome = {};
$("indietro").onclick = su;
if (tg && tg.BackButton) tg.BackButton.onClick(su);
$("cerca").oninput = disegna;

fetch("pannello.json?" + Date.now()).then(r => r.ok ? r.json() : null).then(p => { pannello = p; if (dati) disegna(); }).catch(() => {});
fetch("dati.json?" + Date.now()).then(r => r.json()).then(d => {
  dati = d;
  tipiPerNome = Object.fromEntries(d.tipi.map(x => [x.tipo, x.nome]));
  $("piede").textContent = "Aggiornato il " + d.aggiornato + " · i file si aprono nel gruppo Telegram";
  disegna();
}).catch(() => { $("elenco").innerHTML = `<div class="vuoto">Elenco non disponibile, riprova tra poco</div>`; });
</script>
</body>
</html>
