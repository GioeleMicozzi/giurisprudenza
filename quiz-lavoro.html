<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Quiz Diritto del lavoro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1f24; --muted:#636873; --line:#e2ded5;
  --accent:#2f5d8a; --accent-ink:#ffffff; --soft:#e9eff6;
  --ok:#1f7a4a; --ok-bg:#e3f3ea; --ko:#b23a32; --ko-bg:#f9e4e2;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171b; --card:#1f2228; --ink:#eceef2; --muted:#a2a8b3; --line:#30343c;
    --accent:#7fb0e0; --accent-ink:#0f1720; --soft:#22303f;
    --ok:#6fd19a; --ok-bg:#183527; --ko:#f08a80; --ko-bg:#3d1f1d;
  }
}
:root[data-theme="dark"]{
  --bg:#15171b; --card:#1f2228; --ink:#eceef2; --muted:#a2a8b3; --line:#30343c;
  --accent:#7fb0e0; --accent-ink:#0f1720; --soft:#22303f;
  --ok:#6fd19a; --ok-bg:#183527; --ko:#f08a80; --ko-bg:#3d1f1d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:1.45rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.modi{display:grid;gap:10px;margin-bottom:22px}
.modo{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font:inherit;cursor:pointer}
.modo:hover{border-color:var(--accent)}
.modo b{display:block;font-size:1.02rem}
.modo span{color:var(--muted);font-size:.9rem}
.modo.principale{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.modo.principale span{color:inherit;opacity:.85}
.modo[disabled]{opacity:.5;cursor:default}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
.temi{display:grid;gap:6px}
.tema{display:flex;justify-content:space-between;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;text-align:left;padding:10px 2px;cursor:pointer}
.tema:hover{color:var(--accent)}
.tema small{color:var(--muted);white-space:nowrap}
.tema.fatto>span{color:var(--muted)}
.tema.fatto small{color:var(--ok);font-weight:600}
.tema .spunta{color:var(--ok);font-weight:700;margin-right:6px}
.barra{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.barra i{display:block;height:100%;background:var(--accent);transition:width .2s}
.testa{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.88rem}
.etichetta{display:inline-block;background:var(--soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600;margin-bottom:10px}
.domanda{font-size:1.15rem;font-weight:600;margin:0 0 16px;line-height:1.4}
.opzioni{display:grid;gap:9px}
.opz{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;line-height:1.4}
.opz:hover:not([disabled]){border-color:var(--accent)}
.opz .l{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:-1px}
.opz[disabled]{cursor:default}
.opz.giusta{border-color:var(--ok);background:var(--ok-bg)}
.opz.giusta .l{background:var(--ok);color:var(--card)}
.opz.sbagliata{border-color:var(--ko);background:var(--ko-bg)}
.opz.sbagliata .l{background:var(--ko);color:var(--card)}
.esito{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.95rem}
.esito.ok{background:var(--ok-bg);color:var(--ink);border-left:4px solid var(--ok)}
.esito.ko{background:var(--ko-bg);color:var(--ink);border-left:4px solid var(--ko)}
.esito b{display:block;margin-bottom:2px}
.azioni{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.punti{font-size:2.6rem;font-weight:700;margin:4px 0;letter-spacing:-.02em}
.voto{color:var(--muted);margin:0 0 14px}
.errore{border-top:1px solid var(--line);padding:12px 0}
.errore p{margin:0 0 4px}
.errore .tua{color:var(--ko)}
.errore .ok{color:var(--ok);font-weight:600}
.errore .sp{color:var(--muted);font-size:.92rem}
.nota{color:var(--muted);font-size:.85rem;margin-top:22px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

<script>
const DATI = {"materia": "Diritto del lavoro", "titolo": "Domande del parziale", "creato": "2026-11-17", "fonte": "_parziale.json", "domande": [{"tema": "Fonti e principi", "domanda": "Le norme del diritto del lavoro sono di regola:", "giusta": "relativamente inderogabili: non si possono peggiorare, ma si possono migliorare", "sbagliate": ["assolutamente inderogabili: non si possono né peggiorare né migliorare", "dispositive: le parti possono derogarvi liberamente", "derogabili solo in peggio dal contratto individuale"], "spiegazione": "È il favor per il lavoratore: niente deroghe in peius, sempre ammesse quelle in melius."}, {"tema": "Fonti e principi", "domanda": "Che cosa succede alla clausola del contratto individuale che viola un minimo inderogabile di legge?", "giusta": "è nulla ed è sostituita di diritto dalla norma (inserzione automatica); il contratto resta in piedi", "sbagliate": ["è nullo l'intero contratto", "è annullabile su domanda del lavoratore entro sei mesi", "resta valida se il lavoratore l'ha firmata"], "spiegazione": "Il contratto resta, altrimenti il lavoratore perderebbe il posto."}, {"tema": "Fonti e principi", "domanda": "Per il principio del favore, quale fonte prevale?", "giusta": "quella inferiore, se è più favorevole al lavoratore", "sbagliate": ["sempre quella superiore", "sempre il contratto collettivo", "sempre la più recente"], "spiegazione": "La fonte superiore cede a quella inferiore più favorevole."}, {"tema": "Fonti e principi", "domanda": "Per stabilire quale trattamento è più favorevole, la giurisprudenza preferisce:", "giusta": "il confronto fra singole clausole (cumulo)", "sbagliate": ["il confronto fra le intere discipline (conglobamento)", "la scelta del lavoratore", "il trattamento più recente"], "spiegazione": "Conglobamento = discipline intere; cumulo = clausole: la giurisprudenza preferisce le clausole."}, {"tema": "Fonti e principi", "domanda": "Una direttiva UE incondizionata e precisa, non recepita:", "giusta": "si può far valere solo contro lo Stato (efficacia verticale)", "sbagliate": ["vale anche fra privati", "non ha alcun effetto", "è direttamente applicabile come un regolamento"], "spiegazione": "Fra privati resta solo l'interpretazione conforme."}, {"tema": "Fonti e principi", "domanda": "Gli usi aziendali:", "giusta": "entrano nel contratto individuale e possono migliorare legge e contratto collettivo", "sbagliate": ["cedono sempre al contratto individuale anche se più favorevoli", "valgono solo per i lavoratori assunti prima del loro formarsi", "non possono mai essere modificati in peggio"], "spiegazione": "Valgono anche per i nuovi assunti; un accordo successivo può modificarli anche in peggio. Sono gli usi normativi a cedere alla legge e ai contratti."}, {"tema": "Fonti e principi", "domanda": "Il diritto al lavoro dell'art. 4 Cost., secondo la Corte costituzionale, è:", "giusta": "il diritto a non essere licenziati ingiustamente", "sbagliate": ["il diritto a conservare in ogni caso il posto", "il diritto a ottenere un posto dallo Stato", "un principio senza contenuto giuridico"], "spiegazione": "Non garantisce il posto in ogni caso."}, {"tema": "Fonti e principi", "domanda": "Qual è il principio costituzionale cardine che giustifica i vantaggi dati al lavoratore?", "giusta": "l'uguaglianza sostanziale (art. 3, comma 2, Cost.)", "sbagliate": ["la libertà di iniziativa economica (art. 41 Cost.)", "l'uguaglianza formale (art. 3, comma 1, Cost.)", "la libertà sindacale (art. 39 Cost.)"], "spiegazione": ""}, {"tema": "Subordinazione e autonomia", "domanda": "Per la giurisprudenza, è subordinato chi è assoggettato:", "giusta": "al potere direttivo, organizzativo e disciplinare del datore", "sbagliate": ["al solo potere di controllo del committente", "a un orario fisso", "a un compenso a tempo"], "spiegazione": "È la nozione giurisprudenziale ricordata nel ripasso del 16/11."}, {"tema": "Subordinazione e autonomia", "domanda": "Nell'art. 2094 c.c., l'espressione decisiva per la subordinazione è:", "giusta": "«alle dipendenze e sotto la direzione» (eterodirezione)", "sbagliate": ["«si obbliga»", "«mediante retribuzione»", "«lavoro intellettuale o manuale»"], "spiegazione": "«Si obbliga» = contratto; «mediante retribuzione» = onerosità."}, {"tema": "Subordinazione e autonomia", "domanda": "Chi chiede di essere riconosciuto lavoratore subordinato:", "giusta": "deve provarlo (art. 2697 c.c.)", "sbagliate": ["non deve provare nulla: la subordinazione si presume", "deve solo provare di aver lavorato", "deve solo provare il nome dato al contratto"], "spiegazione": "L'onere si inverte solo se il giudice presume la subordinazione."}, {"tema": "Subordinazione e autonomia", "domanda": "Il nome dato dalle parti al contratto (nomen iuris):", "giusta": "conta solo se non è smentito da come il rapporto si è svolto", "sbagliate": ["è sempre decisivo", "non conta mai", "conta solo se il contratto è certificato"], "spiegazione": "Decide il giudice guardando ai fatti."}, {"tema": "Subordinazione e autonomia", "domanda": "L'indice più forte della subordinazione è:", "giusta": "la doppia alienità (del risultato e dell'organizzazione)", "sbagliate": ["l'orario di lavoro fisso", "il luogo di lavoro imposto", "il compenso mensile"], "spiegazione": "Gli indici sono sussidiari e si valutano insieme; nessuno è decisivo da solo."}, {"tema": "Subordinazione e autonomia", "domanda": "Il metodo con cui il giudice usa gli indici della subordinazione si chiama:", "giusta": "tipologico", "sbagliate": ["sussuntivo", "presuntivo assoluto", "analogico"], "spiegazione": "Misura quanto il caso è vicino al modello del lavoro subordinato."}, {"tema": "Subordinazione e autonomia", "domanda": "Il contratto di lavoro può essere:", "giusta": "o subordinato o autonomo: non esiste un terzo tipo", "sbagliate": ["subordinato, autonomo o parasubordinato, come tre tipi distinti", "subordinato, autonomo o etero-organizzato, come tre tipi distinti", "di qualunque tipo le parti scelgano, purché scritto"], "spiegazione": "Anche la Cassazione sui rider (1663/2020) ha escluso il terzo genere."}, {"tema": "Subordinazione e autonomia", "domanda": "Il socio lavoratore di cooperativa:", "giusta": "ha, accanto al rapporto associativo, un distinto rapporto di lavoro, subordinato o autonomo", "sbagliate": ["non può mai essere lavoratore subordinato", "è sempre lavoratore autonomo", "è un associato in partecipazione"], "spiegazione": ""}, {"tema": "Subordinazione e autonomia", "domanda": "Dal 2015, nell'associazione in partecipazione con una persona fisica:", "giusta": "l'apporto non può più consistere in lavoro", "sbagliate": ["l'apporto deve consistere solo in lavoro", "l'associato è sempre subordinato", "si applica la disciplina delle co.co.co."], "spiegazione": ""}, {"tema": "Parasubordinazione, rider, lavoro agile", "domanda": "Le collaborazioni coordinate e continuative sono definite da:", "giusta": "art. 409, n. 3, c.p.c.", "sbagliate": ["art. 2094 c.c.", "art. 2222 c.c.", "art. 2 d.lgs. 81/2015"], "spiegazione": "È l'unica definizione: la norma sul rito del lavoro."}, {"tema": "Parasubordinazione, rider, lavoro agile", "domanda": "Nella co.co.co., la collaborazione si intende coordinata quando:", "giusta": "le parti concordano il coordinamento e il collaboratore si organizza da solo", "sbagliate": ["il committente organizza tempi e luogo del lavoro", "il committente dà ordini specifici e ripetuti", "il collaboratore lavora nei locali del committente"], "spiegazione": "Auto-organizzata = co.co.co.; organizzata dal committente = etero-organizzata."}, {"tema": "Parasubordinazione, rider, lavoro agile", "domanda": "Alle collaborazioni organizzate dal committente (art. 2 d.lgs. 81/2015):", "giusta": "si applica la disciplina del lavoro subordinato", "sbagliate": ["si applicano solo le tutele dell'art. 409 c.p.c.", "si applica la disciplina del lavoro a progetto", "si applica la disciplina del lavoro autonomo occasionale"], "spiegazione": "È una norma di disciplina: il rapporto non «diventa» subordinato."}, {"tema": "Parasubordinazione, rider, lavoro agile", "domanda": "Nel caso Foodora, la Cassazione (n. 1663/2020):", "giusta": "ha applicato l'art. 2 senza creare un terzo genere: i rider hanno avuto le differenze retributive", "sbagliate": ["ha riconosciuto un terzo genere fra autonomia e subordinazione", "ha dichiarato i rider lavoratori subordinati con reintegrazione", "ha respinto la domanda dei rider"], "spiegazione": "Il terzo genere era la tesi della Corte d'appello di Torino."}, {"tema": "Parasubordinazione, rider, lavoro agile", "domanda": "Con il d.l. 62/2026 (attuazione della direttiva 2024/2831), chi lavora tramite piattaforma:", "giusta": "si presume subordinato quando emergono indici di controllo o di eterodirezione, che deve portare il lavoratore", "sbagliate": ["è sempre subordinato senza eccezioni", "è sempre lavoratore autonomo", "è un co.co.co. per legge"], "spiegazione": "Per questo la presunzione è ritenuta depotenziata."}, {"tema": "Parasubordinazione, rider, lavoro agile", "domanda": "Il lavoro agile è:", "giusta": "una modalità di svolgimento del lavoro subordinato", "sbagliate": ["un nuovo tipo di contratto di lavoro", "una forma di lavoro autonomo", "lo stesso del telelavoro"], "spiegazione": "Al contratto si aggiunge un accordo scritto."}, {"tema": "Parasubordinazione, rider, lavoro agile", "domanda": "Se una parte recede dall'accordo di lavoro agile:", "giusta": "finisce il lavoro agile, non il contratto di lavoro", "sbagliate": ["si estingue il rapporto di lavoro", "il lavoratore deve dimettersi", "serve il consenso dell'Ispettorato"], "spiegazione": ""}, {"tema": "Parasubordinazione, rider, lavoro agile", "domanda": "Il telelavoro si distingue dal lavoro agile perché:", "giusta": "si lavora regolarmente fuori dall'azienda, in una sede fissa e con orario fisso", "sbagliate": ["è una forma di lavoro autonomo", "si svolge solo in parte fuori dall'azienda, senza orario", "non richiede alcun accordo"], "spiegazione": ""}, {"tema": "Parasubordinazione, rider, lavoro agile", "domanda": "Il lavoratore ha diritto al lavoro agile?", "giusta": "no: se il datore lo attiva, alcune categorie hanno solo la priorità", "sbagliate": ["sì, sempre, se la mansione lo consente", "sì, se ha figli fino a 12 anni", "sì, dopo sei mesi di anzianità"], "spiegazione": "Priorità: genitori di figli fino a 12 anni o disabili, disabili gravi, caregiver."}, {"tema": "Certificazione", "domanda": "La certificazione dei contratti è regolata da:", "giusta": "d.lgs. 276/2003, artt. 75 ss. (legge Biagi)", "sbagliate": ["d.lgs. 81/2015, art. 2", "art. 2113 c.c.", "l. 604/1966"], "spiegazione": "Citata dal prof nel ripasso."}, {"tema": "Certificazione", "domanda": "La procedura di certificazione è:", "giusta": "volontaria e su domanda comune delle parti", "sbagliate": ["obbligatoria per tutti i contratti flessibili", "avviata d'ufficio dall'Ispettorato", "su domanda del solo datore"], "spiegazione": ""}, {"tema": "Certificazione", "domanda": "Gli effetti della certificazione verso i terzi (INPS, Ispettorato, fisco) cessano:", "giusta": "solo con una sentenza di merito del giudice", "sbagliate": ["con un verbale ispettivo", "con una diffida del lavoratore", "dopo cinque anni"], "spiegazione": "Sentenza di merito, non processuale."}, {"tema": "Certificazione", "domanda": "Davanti al giudice del lavoro la certificazione si contesta per:", "giusta": "erronea qualificazione, difformità fra contratto ed esecuzione, vizi del consenso", "sbagliate": ["solo vizi del consenso", "violazione del procedimento ed eccesso di potere", "solo erronea qualificazione"], "spiegazione": "Violazione del procedimento ed eccesso di potere si fanno valere al TAR."}, {"tema": "Mercato del lavoro e assunzione", "domanda": "La comunicazione di assunzione va inviata:", "giusta": "entro il giorno precedente l'inizio del rapporto", "sbagliate": ["entro 5 giorni dall'inizio", "entro il primo mese", "solo per i contratti a tempo indeterminato"], "spiegazione": "Anche per co.co.co., soci di cooperativa e tirocini."}, {"tema": "Mercato del lavoro e assunzione", "domanda": "Il servizio delle agenzie per il lavoro è:", "giusta": "gratuito per il lavoratore: paga il datore", "sbagliate": ["pagato dal lavoratore", "pagato dallo Stato", "pagato metà ciascuno"], "spiegazione": ""}, {"tema": "Mercato del lavoro e assunzione", "domanda": "Quote d'obbligo per i disabili (l. 68/1999) per un datore con oltre 50 dipendenti:", "giusta": "il 7% dei lavoratori", "sbagliate": ["1 lavoratore", "2 lavoratori", "il 15% dei lavoratori"], "spiegazione": "1 da 15 a 35 dipendenti, 2 da 36 a 50, 7% oltre 50."}, {"tema": "Mercato del lavoro e assunzione", "domanda": "Si può lavorare dall'età di:", "giusta": "16 anni, dopo l'obbligo scolastico", "sbagliate": ["14 anni", "15 anni in ogni settore", "18 anni"], "spiegazione": "18 anni per il lavoro notturno e i lavori pericolosi."}, {"tema": "Mercato del lavoro e assunzione", "domanda": "Se il contratto di lavoro è nullo, il lavoro già eseguito:", "giusta": "va comunque retribuito (art. 2126 c.c.), salvo illiceità dell'oggetto o della causa", "sbagliate": ["non dà diritto ad alcun compenso", "va retribuito solo se il lavoratore era in buona fede", "va retribuito solo per metà"], "spiegazione": ""}, {"tema": "Mercato del lavoro e assunzione", "domanda": "Se il datore non informa per iscritto il lavoratore delle condizioni del rapporto (decreto trasparenza):", "giusta": "subisce sanzioni amministrative, ma il contratto non è nullo", "sbagliate": ["il contratto è nullo", "il rapporto si trasforma a tempo indeterminato", "il lavoratore può dimettersi per giusta causa senza altro"], "spiegazione": ""}, {"tema": "Mercato del lavoro e assunzione", "domanda": "Dopo il decreto trasparenza, il datore può vietare al lavoratore di lavorare anche per altri:", "giusta": "solo per salute e sicurezza, segretezza o conflitto di interessi", "sbagliate": ["sempre, se lo prevede il contratto individuale", "mai, in nessun caso", "solo durante il periodo di prova"], "spiegazione": "Nel rispetto di orario, riposi e divieto di concorrenza."}, {"tema": "Patto di prova e di non concorrenza", "domanda": "Il patto di prova deve essere:", "giusta": "scritto a pena di nullità e firmato prima dell'inizio del lavoro", "sbagliate": ["scritto solo ai fini della prova", "anche orale, se il lavoratore lo accetta", "scritto entro la prima settimana di lavoro"], "spiegazione": "Senza, l'assunzione è definitiva dal primo giorno."}, {"tema": "Patto di prova e di non concorrenza", "domanda": "La durata massima del periodo di prova è:", "giusta": "sei mesi", "sbagliate": ["tre mesi", "dodici mesi", "un mese"], "spiegazione": "Malattia, infortunio e maternità la sospendono."}, {"tema": "Patto di prova e di non concorrenza", "domanda": "Una lavoratrice accetta la lettera con patto di prova con un messaggio WhatsApp. Per la Corte d'appello di Napoli (798/2026):", "giusta": "il patto è nullo perché manca la sottoscrizione, ma il contratto resta", "sbagliate": ["il patto è valido perché il messaggio è scritto", "è nullo l'intero contratto di lavoro", "il patto è valido se il datore lo conferma per e-mail"], "spiegazione": "Il licenziamento per mancato superamento della prova è quindi senza giustificazione: reintegrazione."}, {"tema": "Patto di prova e di non concorrenza", "domanda": "Durante il periodo di prova il recesso è:", "giusta": "libero, ma deve dipendere dall'esito della prova", "sbagliate": ["sempre arbitrario e non contestabile", "ammesso solo per giusta causa", "ammesso solo con preavviso"], "spiegazione": "Il lavoratore può contestarlo se la prova era superata, non c'è stata davvero o il motivo è illecito."}, {"tema": "Patto di prova e di non concorrenza", "domanda": "Il patto di non concorrenza (art. 2125 c.c.) può durare al massimo:", "giusta": "5 anni per i dirigenti e 3 anni per gli altri", "sbagliate": ["3 anni per tutti", "1 anno per tutti", "5 anni per tutti"], "spiegazione": "Se è più lungo si riduce."}, {"tema": "Patto di prova e di non concorrenza", "domanda": "Il patto di non concorrenza senza corrispettivo, o con corrispettivo irrisorio:", "giusta": "è nullo", "sbagliate": ["è valido ma riducibile dal giudice", "è valido se scritto", "obbliga il datore a pagare un'indennità di legge"], "spiegazione": "Servono anche limiti di oggetto, luogo e tempo."}, {"tema": "Patto di prova e di non concorrenza", "domanda": "La clausola che permette all'azienda di rinunciare al patto di non concorrenza alla fine del rapporto:", "giusta": "è nulla: il patto resta valido e va pagato", "sbagliate": ["è valida", "rende nullo l'intero patto", "è valida se il lavoratore è un dirigente"], "spiegazione": ""}, {"tema": "Contratto a termine", "domanda": "La forma comune di rapporto di lavoro (art. 1 d.lgs. 81/2015) è:", "giusta": "il contratto subordinato a tempo indeterminato", "sbagliate": ["il contratto a termine", "il contratto a tempo parziale", "la collaborazione coordinata e continuativa"], "spiegazione": "Il resto è lavoro flessibile."}, {"tema": "Contratto a termine", "domanda": "Il contratto a termine senza causale è ammesso fino a:", "giusta": "12 mesi", "sbagliate": ["6 mesi", "24 mesi", "36 mesi"], "spiegazione": "Da 12 a 24 mesi serve la causale."}, {"tema": "Contratto a termine", "domanda": "Il tetto complessivo dei contratti a termine fra le stesse parti, per mansioni dello stesso livello, è:", "giusta": "24 mesi, più un solo contratto ulteriore di massimo 12 mesi firmato all'Ispettorato", "sbagliate": ["36 mesi", "12 mesi senza eccezioni", "24 mesi senza alcuna eccezione"], "spiegazione": ""}, {"tema": "Contratto a termine", "domanda": "Le proroghe del contratto a termine possono essere al massimo:", "giusta": "quattro in 24 mesi", "sbagliate": ["cinque in 36 mesi", "due in 12 mesi", "illimitate entro i 24 mesi"], "spiegazione": "Alla quinta proroga il contratto si trasforma."}, {"tema": "Contratto a termine", "domanda": "Differenza fra proroga e rinnovo:", "giusta": "la proroga sposta il termine dello stesso contratto prima della scadenza; il rinnovo è un nuovo contratto dopo la scadenza", "sbagliate": ["sono la stessa cosa", "la proroga è un nuovo contratto, il rinnovo sposta il termine", "il rinnovo richiede sempre l'Ispettorato"], "spiegazione": ""}, {"tema": "Contratto a termine", "domanda": "L'intervallo (stop and go) fra un contratto a termine di 4 mesi e il successivo è:", "giusta": "10 giorni", "sbagliate": ["20 giorni", "30 giorni", "nessuno"], "spiegazione": "10 giorni se il primo durava fino a sei mesi, 20 se di più. Se non è rispettato si trasforma il secondo contratto."}, {"tema": "Contratto a termine", "domanda": "La sanzione tipica delle violazioni sul contratto a termine è:", "giusta": "la trasformazione in contratto a tempo indeterminato", "sbagliate": ["la nullità del contratto", "la sola sanzione amministrativa", "il risarcimento del danno senza trasformazione"], "spiegazione": ""}, {"tema": "Contratto a termine", "domanda": "Superare il limite numerico del 20% di contratti a termine comporta:", "giusta": "solo una sanzione amministrativa, senza trasformazione", "sbagliate": ["la trasformazione di tutti i contratti", "la trasformazione dell'ultimo contratto", "la nullità dei contratti in eccesso"], "spiegazione": "20% della retribuzione per un lavoratore in eccesso, 50% se sono di più."}, {"tema": "Contratto a termine", "domanda": "Il termine non scritto rende il rapporto:", "giusta": "a tempo indeterminato dall'inizio", "sbagliate": ["nullo", "a tempo indeterminato dal tredicesimo mese", "a termine di 12 mesi"], "spiegazione": "Cade solo la clausola (salvo i rapporti fino a 12 giorni)."}, {"tema": "Contratto a termine", "domanda": "Nel lavoro pubblico, il contratto a termine illegittimo:", "giusta": "non si trasforma mai: spetta un risarcimento da 4 a 24 mensilità", "sbagliate": ["si trasforma in tempo indeterminato", "si trasforma solo dopo un concorso interno", "non dà diritto a nulla"], "spiegazione": "Nella P.A. si entra per concorso."}, {"tema": "Contratto a termine", "domanda": "Una lavoratrice assunta a termine per 4 mesi continua a lavorare dopo la scadenza. Il rapporto si trasforma:", "giusta": "oltre il 30° giorno dalla scadenza", "sbagliate": ["oltre il 50° giorno", "oltre il 10° giorno", "subito dal primo giorno dopo la scadenza"], "spiegazione": "30° giorno per i contratti fino a sei mesi, 50° per gli altri; prima spetta la maggiorazione del 20% e poi del 40%."}, {"tema": "Contratto a termine", "domanda": "La cessazione del contratto a termine si impugna:", "giusta": "con atto scritto entro 180 giorni, e poi il ricorso nei 180 successivi", "sbagliate": ["entro 60 giorni, come il licenziamento", "entro 6 mesi dalla cessazione con ricorso", "entro 5 anni"], "spiegazione": "Spetta anche un'indennità da 2,5 a 12 mensilità. Nella somministrazione il termine è 60 giorni."}, {"tema": "Contratto a termine", "domanda": "Il diritto di precedenza nelle assunzioni spetta a chi ha lavorato a termine:", "giusta": "per più di sei mesi nella stessa azienda", "sbagliate": ["per più di dodici mesi", "per almeno tre mesi", "per qualunque durata"], "spiegazione": "Va esercitato per iscritto entro sei mesi dalla cessazione (tre per gli stagionali)."}, {"tema": "Divieti dei contratti flessibili", "domanda": "Quale di questi NON è un divieto di assunzione a termine?", "giusta": "assumere lavoratori con più di 50 anni", "sbagliate": ["sostituire lavoratori in sciopero", "assumere senza aver fatto la valutazione dei rischi", "assumere per le stesse mansioni nelle unità con lavoratori in cassa integrazione"], "spiegazione": "I lavoratori con più di 50 anni sono anzi esenti dal limite del 20%."}, {"tema": "Divieti dei contratti flessibili", "domanda": "Perché non si può assumere a termine per sostituire lavoratori in sciopero?", "giusta": "perché svuoterebbe un diritto di rilevanza costituzionale (art. 40 Cost.)", "sbagliate": ["perché lo vieta il contratto collettivo", "perché il lavoratore a termine è più esposto agli infortuni", "perché l'impresa ha già ridotto il personale"], "spiegazione": "Il datore può usare i propri dipendenti, nel rispetto dell'art. 2103."}, {"tema": "Divieti dei contratti flessibili", "domanda": "Che cosa dice l'art. 40 Cost.?", "giusta": "«Il diritto di sciopero si esercita nell'ambito delle leggi che lo regolano»", "sbagliate": ["«Lo sciopero è vietato nei servizi pubblici essenziali»", "«L'organizzazione sindacale è libera»", "«Il lavoratore ha diritto al riposo settimanale»"], "spiegazione": "L'art. 39 è la libertà sindacale."}, {"tema": "Divieti dei contratti flessibili", "domanda": "Che cosa può fare il datore per far fronte a uno sciopero?", "giusta": "usare lavoratori interni, nel rispetto delle regole sul mutamento di mansioni", "sbagliate": ["assumere lavoratori a termine", "ricorrere alla somministrazione", "assumere lavoratori intermittenti"], "spiegazione": "I divieti valgono per termine, intermittente e somministrazione."}, {"tema": "Divieti dei contratti flessibili", "domanda": "Qual è la ragione del divieto di assumere a termine nelle unità con lavoratori in cassa integrazione?", "giusta": "l'impresa ha già ridotto il personale: assumere precari sarebbe contraddittorio", "sbagliate": ["il cassintegrato è licenziato", "tutelare il diritto di sciopero", "incentivare la valutazione dei rischi"], "spiegazione": "Il cassintegrato è sospeso, non licenziato, ma la ragione è la stessa dei licenziamenti collettivi."}, {"tema": "Divieti dei contratti flessibili", "domanda": "Il divieto di assumere a termine senza valutazione dei rischi si spiega perché:", "giusta": "il lavoratore a termine è più esposto e il divieto spinge il datore a fare la valutazione", "sbagliate": ["la valutazione dei rischi serve solo per i lavoratori stabili", "lo impone la direttiva sul salario adeguato", "il lavoratore a termine non può essere formato"], "spiegazione": "Non fare la valutazione è anche punito penalmente."}, {"tema": "Divieti dei contratti flessibili", "domanda": "Il divieto riguarda le unità in cui ci sono stati licenziamenti collettivi per le stesse mansioni:", "giusta": "nei sei mesi precedenti", "sbagliate": ["nei dodici mesi precedenti", "nei tre mesi precedenti", "nei due anni precedenti"], "spiegazione": ""}, {"tema": "Divieti dei contratti flessibili", "domanda": "La violazione dei divieti nel contratto a termine comporta:", "giusta": "la trasformazione in contratto a tempo indeterminato", "sbagliate": ["solo una sanzione amministrativa", "la nullità del contratto senza altre conseguenze", "un'ammenda penale per il datore"], "spiegazione": ""}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Nel part-time, se manca lo scritto:", "giusta": "su domanda del lavoratore il rapporto diventa a tempo pieno", "sbagliate": ["il rapporto diventa automaticamente a tempo pieno", "il contratto è nullo", "il rapporto si trasforma a tempo indeterminato"], "spiegazione": "Non è automatico perché il part-time può essere una scelta del lavoratore."}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Se nel contratto part-time manca la collocazione temporale dell'orario:", "giusta": "la fissa il giudice, con un risarcimento per il passato", "sbagliate": ["il rapporto diventa a tempo pieno", "la decide il datore", "il contratto è nullo"], "spiegazione": "Se manca la durata, invece, su domanda si ha il tempo pieno."}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Il rifiuto del lavoratore di trasformare il rapporto in part-time:", "giusta": "non è giustificato motivo di licenziamento", "sbagliate": ["è giusta causa di licenziamento", "è giustificato motivo oggettivo", "è un'infrazione disciplinare"], "spiegazione": "Il licenziamento nascosto dietro una crisi inesistente è ritorsivo e nullo (Cass. 18547/2024)."}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Il lavoro supplementare nel part-time è:", "giusta": "il lavoro oltre l'orario concordato ma entro il tempo pieno", "sbagliate": ["il lavoro oltre il tempo pieno", "lo spostamento delle ore deciso dal datore", "il lavoro nei giorni festivi"], "spiegazione": "Oltre il tempo pieno è straordinario."}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Il lavoro intermittente si può sempre stipulare con chi ha:", "giusta": "meno di 24 anni o più di 55", "sbagliate": ["meno di 30 anni", "più di 50 anni", "meno di 18 anni"], "spiegazione": "Negli altri casi serve la previsione del contratto collettivo."}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Il lavoratore intermittente con obbligo di risposta:", "giusta": "riceve un'indennità di disponibilità e, se rifiuta senza motivo, è inadempiente", "sbagliate": ["non riceve nulla quando non lavora", "può rifiutare liberamente", "è un lavoratore autonomo"], "spiegazione": "Il tipo senza obbligo di risposta è il più frequente."}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "L'apprendistato è:", "giusta": "un contratto a tempo indeterminato con causa formativa", "sbagliate": ["un contratto a termine di massimo tre anni", "un tirocinio", "un contratto di lavoro autonomo"], "spiegazione": "A fine formazione ciascuna parte può recedere con preavviso."}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Se il datore non fa la formazione all'apprendista, per la Cassazione:", "giusta": "il contratto è nullo per mancanza di causa ed è fin dall'inizio un rapporto ordinario a tempo indeterminato", "sbagliate": ["il contratto si trasforma in contratto a termine", "il datore paga solo una sanzione amministrativa", "l'apprendistato si proroga di un anno"], "spiegazione": "Più la differenza contributiva maggiorata del 100% (App. Milano 475/2026, il bar)."}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Nell'apprendistato è vietata la retribuzione:", "giusta": "a cottimo", "sbagliate": ["a tempo", "in natura", "mensile"], "spiegazione": "Chi deve imparare non va spinto a produrre."}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Il tirocinio:", "giusta": "non è un rapporto di lavoro e dà diritto a un'indennità di almeno 300 euro lordi al mese", "sbagliate": ["è un rapporto di lavoro subordinato", "dà diritto alla retribuzione del contratto collettivo", "dura al massimo un mese"], "spiegazione": ""}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Nella somministrazione, il potere disciplinare spetta:", "giusta": "all'agenzia; l'utilizzatore le comunica i fatti", "sbagliate": ["all'utilizzatore", "a entrambi in solido", "all'Ispettorato"], "spiegazione": "Il potere direttivo invece è dell'utilizzatore."}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Se manca il contratto scritto di somministrazione:", "giusta": "i lavoratori sono dipendenti dell'utilizzatore", "sbagliate": ["il contratto si trasforma a tempo indeterminato con l'agenzia", "c'è solo una sanzione amministrativa", "il lavoratore ha diritto a un'indennità"], "spiegazione": ""}, {"tema": "Part-time, intermittente, apprendistato, somministrazione", "domanda": "Se l'agenzia di somministrazione non paga le retribuzioni:", "giusta": "l'utilizzatore è obbligato in solido", "sbagliate": ["il lavoratore può rivolgersi solo all'agenzia", "paga l'INPS", "paga il Fondo di garanzia"], "spiegazione": ""}, {"tema": "Appalto e distacco", "domanda": "L'appalto è genuino quando l'appaltatore:", "giusta": "organizza i mezzi, corre il rischio d'impresa e dirige i lavoratori", "sbagliate": ["fornisce solo manodopera", "lavora nei locali del committente", "riceve un compenso a ore"], "spiegazione": "Il punto decisivo è chi dà gli ordini."}, {"tema": "Appalto e distacco", "domanda": "Nell'appalto genuino, se l'appaltatore non paga, il committente è obbligato in solido:", "giusta": "per due anni dalla fine dell'appalto", "sbagliate": ["per cinque anni", "per sei mesi", "mai"], "spiegazione": "Copre retribuzioni, TFR e contributi; non vale per il committente persona fisica e negli appalti pubblici."}, {"tema": "Appalto e distacco", "domanda": "Nello pseudo-appalto il lavoratore può chiedere:", "giusta": "di essere dichiarato dipendente del committente dall'inizio", "sbagliate": ["solo un risarcimento", "di essere assunto dall'Ispettorato", "la sola reintegrazione presso l'appaltatore"], "spiegazione": "Impugnando entro 60 giorni dalla cessazione e ricorrendo entro 180."}, {"tema": "Appalto e distacco", "domanda": "Il distacco richiede:", "giusta": "un interesse proprio del distaccante e la temporaneità", "sbagliate": ["il consenso del lavoratore in ogni caso", "un contratto di somministrazione", "il trasferimento del rapporto al distaccatario"], "spiegazione": "Il consenso serve solo se cambiano le mansioni."}, {"tema": "Mansioni (art. 2103)", "domanda": "Oggi le mansioni sono equivalenti quando:", "giusta": "sono riconducibili allo stesso livello e categoria legale di inquadramento", "sbagliate": ["permettono di conservare la professionalità acquisita", "sono pagate allo stesso modo", "sono scelte dal lavoratore"], "spiegazione": "È l'equivalenza formale introdotta nel 2015."}, {"tema": "Mansioni (art. 2103)", "domanda": "Prima del 2015 la giurisprudenza chiedeva, per spostare il lavoratore:", "giusta": "anche l'equivalenza professionale, cioè la conservazione della professionalità acquisita", "sbagliate": ["solo lo stesso livello contrattuale", "il consenso del lavoratore", "l'autorizzazione dell'Ispettorato"], "spiegazione": "Il nuovo art. 2103 non parla più di professionalità."}, {"tema": "Mansioni (art. 2103)", "domanda": "Il lavoratore adibito a mansioni superiori ha diritto:", "giusta": "subito al trattamento corrispondente e, dopo sei mesi continuativi (o il periodo del contratto collettivo), alla promozione", "sbagliate": ["solo alla promozione dopo un anno", "solo alla differenza retributiva, mai alla promozione", "alla promozione immediata"], "spiegazione": ""}, {"tema": "Mansioni (art. 2103)", "domanda": "Non c'è diritto alla promozione definitiva quando il lavoratore:", "giusta": "sostituisce un collega assente con diritto alla conservazione del posto", "sbagliate": ["ha svolto le mansioni superiori per sei mesi continuativi", "è un impiegato", "è stato assegnato senza consenso"], "spiegazione": "L'altra eccezione è la volontà contraria del lavoratore."}, {"tema": "Mansioni (art. 2103)", "domanda": "Il demansionamento unilaterale è ammesso quando:", "giusta": "una modifica degli assetti organizzativi incide sulla posizione del lavoratore", "sbagliate": ["il lavoratore commette un'infrazione disciplinare", "il datore vuole ridurre i costi del personale", "il lavoratore ha più di 55 anni"], "spiegazione": "Un livello sotto, nella stessa categoria legale, con comunicazione scritta a pena di nullità."}, {"tema": "Mansioni (art. 2103)", "domanda": "Nel demansionamento per riorganizzazione il lavoratore:", "giusta": "conserva livello e retribuzione, salvo le indennità legate al modo di lavorare di prima", "sbagliate": ["perde il livello e la retribuzione superiore", "conserva tutto, comprese tutte le indennità", "ha diritto a un'indennità di demansionamento"], "spiegazione": "Es. l'indennità di cassa del cassiere spostato in ufficio, l'indennità di sottosuolo."}, {"tema": "Mansioni (art. 2103)", "domanda": "Il patto di demansionamento (accordo individuale) richiede:", "giusta": "un interesse del lavoratore e la firma in sede protetta", "sbagliate": ["solo la firma del lavoratore", "l'autorizzazione del giudice", "una crisi aziendale"], "spiegazione": "Interessi: conservare il posto, acquisire un'altra professionalità, migliorare le condizioni di vita. Può ridurre anche categoria, livello e retribuzione."}, {"tema": "Mansioni (art. 2103)", "domanda": "Che cosa prevede l'art. 2103 per i patti diversi dalle ipotesi di legge?", "giusta": "ogni patto contrario è nullo", "sbagliate": ["sono annullabili entro sei mesi", "sono validi se migliorativi per il datore", "sono validi se firmati dal sindacato"], "spiegazione": "Fuori dai casi di legge c'è il danno da demansionamento, che va provato."}, {"tema": "Mansioni (art. 2103)", "domanda": "Il passaggio del lavoratore a un'altra categoria legale (per esempio da quadro a impiegato):", "giusta": "non si può mai imporre unilateralmente", "sbagliate": ["è sempre ammesso per riorganizzazione", "è ammesso se lo prevede il contratto collettivo", "è ammesso con un preavviso di 30 giorni"], "spiegazione": "Solo con l'accordo in sede protetta."}, {"tema": "Mansioni (art. 2103)", "domanda": "Nella lettera di assegnazione a mansioni inferiori, l'oggetto corretto è:", "giusta": "«Variazione di mansioni» o «Assegnazione a mansioni inferiori ai sensi dell'art. 2103 c.c.»", "sbagliate": ["«Demansionamento»", "«Sanzione disciplinare»", "«Trasferimento per incompatibilità»"], "spiegazione": "«Demansionamento» è una qualificazione giuridica e negli atti non compare."}, {"tema": "Retribuzione", "domanda": "L'art. 36 Cost. garantisce una retribuzione:", "giusta": "proporzionata alla quantità e qualità del lavoro e in ogni caso sufficiente a un'esistenza libera e dignitosa", "sbagliate": ["pari al minimo vitale", "fissata per legge in 9 euro l'ora", "uguale per tutti i lavoratori"], "spiegazione": "La sufficienza è il limite sotto cui non si può andare."}, {"tema": "Retribuzione", "domanda": "Come si stabilisce in Italia la retribuzione sufficiente?", "giusta": "con i minimi dei contratti collettivi nazionali", "sbagliate": ["con un salario minimo legale", "con decreto ministeriale annuale", "con l'accordo individuale"], "spiegazione": "Orientamento giurisprudenziale da decenni, confermato dal d.l. 62/2026."}, {"tema": "Retribuzione", "domanda": "La direttiva europea sul salario adeguato (2022/2041):", "giusta": "non impone il salario legale se la contrattazione collettiva copre almeno l'80% dei lavoratori", "sbagliate": ["impone a tutti gli Stati un salario minimo legale", "fissa il salario minimo europeo in 9 euro l'ora", "vieta il salario minimo legale"], "spiegazione": "In Italia la copertura è ufficialmente oltre l'80%."}, {"tema": "Retribuzione", "domanda": "L'unico caso di retribuzione minima fissata per legge in Italia è:", "giusta": "il contratto di prestazione occasionale: 9 euro l'ora", "sbagliate": ["l'apprendistato", "il lavoro domestico", "il lavoro a domicilio"], "spiegazione": "È anche la cifra di tutte le proposte di legge sul salario minimo, mai approvate."}, {"tema": "Retribuzione", "domanda": "Con la sentenza 27711/2023 (vigilanza privata), la Cassazione ha detto che il giudice:", "giusta": "può discostarsi dal contratto collettivo, motivando, se la retribuzione non è sufficiente", "sbagliate": ["deve sempre applicare il contratto leader", "non può mai valutare la sufficienza", "deve applicare il salario minimo europeo"], "spiegazione": "Può usare i contratti di settori affini o indicatori economici."}, {"tema": "Retribuzione", "domanda": "Le forme della retribuzione dell'art. 2099 c.c. sono:", "giusta": "a tempo o a cottimo, con partecipazione agli utili o in natura", "sbagliate": ["solo a tempo", "solo in denaro", "a tempo, a cottimo e a progetto"], "spiegazione": ""}, {"tema": "Retribuzione", "domanda": "Che cosa NON rientra nella nozione onnicomprensiva di retribuzione?", "giusta": "i rimborsi spese e le somme occasionali", "sbagliate": ["la tredicesima", "gli scatti di anzianità", "le indennità di turno"], "spiegazione": "Nozione onnicomprensiva per TFR e indennità di mancato preavviso (artt. 2120 e 2121 c.c.)."}, {"tema": "Retribuzione", "domanda": "La «retribuzione globale di fatto» dell'art. 18 St. lav. è:", "giusta": "la stessa cosa della nozione onnicomprensiva: tutto quello che il lavoratore percepiva", "sbagliate": ["solo la paga base", "la paga base più la tredicesima", "la retribuzione del contratto leader"], "spiegazione": ""}, {"tema": "Retribuzione", "domanda": "Il TFR è:", "giusta": "retribuzione differita, accantonata ogni anno e pagata alla fine del rapporto", "sbagliate": ["un'indennità risarcitoria per il licenziamento", "un premio facoltativo", "un contributo previdenziale"], "spiegazione": "Circa una mensilità l'anno."}, {"tema": "Retribuzione", "domanda": "Un'invenzione nata durante il lavoro, quando inventare non era l'oggetto del contratto (invenzione d'azienda):", "giusta": "spetta al datore, ma al lavoratore va un equo premio", "sbagliate": ["spetta al lavoratore", "spetta al datore senza alcun compenso", "spetta in comproprietà a entrambi"], "spiegazione": "Nell'invenzione di servizio nessun compenso in più; in quella occasionale il datore ha solo un diritto di opzione."}, {"tema": "Sicurezza sul lavoro", "domanda": "L'art. 2087 c.c. chiede al datore:", "giusta": "la massima sicurezza tecnologicamente possibile", "sbagliate": ["le misure che le imprese del settore adottano di solito", "solo le misure previste dal Testo unico", "le misure concordate con i sindacati"], "spiegazione": "Tutela l'integrità fisica e la personalità morale."}, {"tema": "Sicurezza sul lavoro", "domanda": "La responsabilità del datore per violazione dell'art. 2087 è:", "giusta": "contrattuale: per liberarsi deve provare di aver fatto tutto il possibile", "sbagliate": ["extracontrattuale: il lavoratore deve provare la colpa", "solo penale", "oggettiva senza possibilità di prova contraria"], "spiegazione": "Il lavoratore può anche rifiutare la prestazione pericolosa conservando la retribuzione."}, {"tema": "Sicurezza sul lavoro", "domanda": "Chi ha una posizione di garanzia nella sicurezza?", "giusta": "datore, dirigente, preposto e lavoratore", "sbagliate": ["solo il datore di lavoro", "datore e RSPP", "datore, medico competente e RLS"], "spiegazione": "Il lavoratore ha un ruolo di garanzia per sé e per i colleghi."}, {"tema": "Sicurezza sul lavoro", "domanda": "Il lavoratore che non rispetta le norme di sicurezza rischia:", "giusta": "sanzioni penali e disciplinari, fino al licenziamento", "sbagliate": ["nessuna sanzione: è solo protetto", "solo sanzioni civili", "solo il richiamo verbale"], "spiegazione": ""}, {"tema": "Sicurezza sul lavoro", "domanda": "Il datore risponde dell'infortunio dovuto all'imprudenza del lavoratore?", "giusta": "sì, salvo il rischio elettivo, un comportamento anomalo e imprevedibile", "sbagliate": ["no, mai", "solo se il lavoratore è un principiante", "solo se c'è stato un controllo dell'ASL"], "spiegazione": "Deve pretendere il rispetto delle regole anche con le sanzioni disciplinari."}, {"tema": "Sicurezza sul lavoro", "domanda": "Che cosa NON si può delegare a un dirigente?", "giusta": "la valutazione dei rischi e la nomina del responsabile del servizio di prevenzione", "sbagliate": ["l'acquisto dei dispositivi di protezione", "la formazione dei lavoratori", "la vigilanza sui preposti"], "spiegazione": "La delega deve essere scritta, accettata per iscritto, con autonomia di spesa."}, {"tema": "Sicurezza sul lavoro", "domanda": "Il preposto:", "giusta": "sovrintende al lavoro e controlla; non ha potere di spesa e segnalando si libera", "sbagliate": ["ha poteri di decisione e di spesa", "è il responsabile del servizio di prevenzione", "è eletto dai lavoratori"], "spiegazione": "Es. il caporeparto, il caposquadra."}, {"tema": "Sicurezza sul lavoro", "domanda": "Il medico competente:", "giusta": "fa la sorveglianza sanitaria e dà il giudizio di idoneità alla mansione", "sbagliate": ["fa le visite fiscali di controllo della malattia", "è eletto dai lavoratori", "è sempre un dipendente dell'ASL"], "spiegazione": ""}, {"tema": "Sicurezza sul lavoro", "domanda": "Che rapporto può avere il medico competente con il datore?", "giusta": "suo dipendente, libero professionista o dipendente di una struttura esterna convenzionata", "sbagliate": ["solo dipendente pubblico dell'ASL", "solo libero professionista", "solo dipendente del datore"], "spiegazione": "L'ipotesi più frequente è la struttura esterna convenzionata."}, {"tema": "Sicurezza sul lavoro", "domanda": "Contro il giudizio del medico competente si ricorre:", "giusta": "entro 30 giorni all'organo di vigilanza della ASL (art. 41, comma 9, d.lgs. 81/2008)", "sbagliate": ["entro 60 giorni al giudice del lavoro", "entro 30 giorni all'INPS", "entro 5 giorni al datore"], "spiegazione": "Possono avere interesse sia il lavoratore sia l'azienda."}, {"tema": "Sicurezza sul lavoro", "domanda": "Se il lavoratore è giudicato inidoneo alla mansione e non c'è un posto compatibile:", "giusta": "si può arrivare al licenziamento per giustificato motivo oggettivo", "sbagliate": ["il datore deve tenerlo senza lavoro e pagarlo", "il rapporto si sospende senza limiti", "è licenziato per giusta causa"], "spiegazione": "Prima vanno cercate mansioni equivalenti o inferiori, conservando la retribuzione."}, {"tema": "Sicurezza sul lavoro", "domanda": "Il rappresentante dei lavoratori per la sicurezza (RLS):", "giusta": "è eletto dai lavoratori e ha diritti, non obblighi", "sbagliate": ["è nominato dal datore", "ha poteri di spesa", "fa la sorveglianza sanitaria"], "spiegazione": "Ma la Cass. pen. 38914/2023 ne ha condannato uno: decisione molto criticata."}, {"tema": "Sicurezza sul lavoro", "domanda": "Le violazioni del Testo unico sulla sicurezza sono:", "giusta": "contravvenzioni, punite anche se non succede nulla", "sbagliate": ["illeciti solo amministrativi", "delitti dolosi", "illeciti civili"], "spiegazione": "Se c'è l'infortunio scattano omicidio o lesioni colpose."}, {"tema": "Sicurezza sul lavoro", "domanda": "L'infortunio in itinere è:", "giusta": "l'infortunio sul normale percorso fra casa e lavoro, coperto dall'INAIL", "sbagliate": ["un infortunio non coperto", "una malattia professionale", "l'infortunio durante la trasferta all'estero"], "spiegazione": ""}, {"tema": "Sicurezza sul lavoro", "domanda": "Il danno differenziale è:", "giusta": "la parte di danno che l'INAIL non copre, chiesta al datore penalmente responsabile", "sbagliate": ["il danno da demansionamento", "il danno morale", "la differenza fra NASpI e retribuzione"], "spiegazione": ""}, {"tema": "Sicurezza sul lavoro", "domanda": "Il mobbing è:", "giusta": "un insieme sistematico di condotte, anche lecite una per una, per perseguitare ed emarginare il lavoratore", "sbagliate": ["un reato autonomo previsto dal codice penale", "un singolo atto illecito del datore", "solo la molestia sessuale"], "spiegazione": "Il danno si risarcisce come violazione dell'art. 2087."}, {"tema": "Discriminazioni, orario, trasferimento", "domanda": "La discriminazione indiretta è:", "giusta": "un criterio apparentemente neutro che svantaggia di fatto un gruppo", "sbagliate": ["un trattamento esplicitamente meno favorevole per sesso", "una molestia", "la preferenza automatica per la donna"], "spiegazione": "Es. un'altezza minima che svantaggia le donne."}, {"tema": "Discriminazioni, orario, trasferimento", "domanda": "Nei giudizi sulle discriminazioni l'onere della prova:", "giusta": "è agevolato: il lavoratore porta elementi anche statistici e il datore deve provare che la discriminazione non c'è", "sbagliate": ["è tutto a carico del lavoratore", "è tutto a carico del datore, senza elementi del lavoratore", "è a carico della consigliera di parità"], "spiegazione": ""}, {"tema": "Discriminazioni, orario, trasferimento", "domanda": "Il licenziamento a causa di matrimonio si presume quando avviene:", "giusta": "fra la richiesta delle pubblicazioni e un anno dopo le nozze", "sbagliate": ["nei sei mesi dopo le nozze", "solo il giorno delle nozze", "fino a tre anni dopo le nozze"], "spiegazione": ""}, {"tema": "Discriminazioni, orario, trasferimento", "domanda": "L'art. 8 dello Statuto vieta al datore:", "giusta": "le indagini sulle opinioni e sui fatti non rilevanti per l'attitudine professionale", "sbagliate": ["i controlli a distanza", "le perquisizioni all'uscita", "le visite fiscali"], "spiegazione": ""}, {"tema": "Discriminazioni, orario, trasferimento", "domanda": "L'orario normale di lavoro è:", "giusta": "40 ore settimanali", "sbagliate": ["48 ore settimanali", "36 ore settimanali", "8 ore al giorno senza limite settimanale"], "spiegazione": "48 ore è la durata massima compreso lo straordinario, come media su 4 mesi."}, {"tema": "Discriminazioni, orario, trasferimento", "domanda": "Il riposo giornaliero è di:", "giusta": "11 ore consecutive ogni 24", "sbagliate": ["8 ore consecutive", "12 ore anche frazionate", "24 ore ogni 7 giorni"], "spiegazione": "24 ore ogni 7 giorni è il riposo settimanale."}, {"tema": "Discriminazioni, orario, trasferimento", "domanda": "Le ferie:", "giusta": "sono almeno 4 settimane l'anno, irrinunciabili, sostituibili con un'indennità solo alla fine del rapporto", "sbagliate": ["sono almeno 2 settimane e si possono monetizzare", "le decide il lavoratore", "sono rinunciabili se il lavoratore lo chiede"], "spiegazione": ""}, {"tema": "Discriminazioni, orario, trasferimento", "domanda": "Il trasferimento del lavoratore richiede:", "giusta": "comprovate ragioni tecniche, organizzative e produttive", "sbagliate": ["il consenso del lavoratore", "una sanzione disciplinare", "l'autorizzazione dell'Ispettorato"], "spiegazione": "Si impugna entro 60 giorni. Per il dirigente sindacale serve il nulla osta del sindacato."}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "L'obbligo di fedeltà (art. 2105 c.c.) comprende:", "giusta": "il divieto di concorrenza durante il rapporto e di divulgare o usare notizie riservate", "sbagliate": ["il divieto di avere un secondo lavoro di qualunque tipo", "il divieto di concorrenza anche dopo la fine del rapporto, senza patto", "l'obbligo di obbedienza"], "spiegazione": "L'obbedienza è nell'art. 2104."}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Le telecamere da cui deriva anche un controllo a distanza dei lavoratori (art. 4 St. lav.):", "giusta": "sono ammesse per esigenze organizzative, di sicurezza o del patrimonio, con accordo sindacale o autorizzazione dell'Ispettorato", "sbagliate": ["sono sempre vietate", "sono libere se il lavoratore è informato", "sono ammesse solo per controllare il lavoro"], "spiegazione": "Per gli strumenti di lavoro e i badge non serve l'accordo."}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "I controlli difensivi:", "giusta": "mirano a scoprire illeciti e sono fuori dall'art. 4 St. lav.", "sbagliate": ["mirano a controllare la prestazione", "richiedono sempre l'accordo sindacale", "sono vietati"], "spiegazione": "Cass. 26682/2017."}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Il potere disciplinare del datore si fonda su:", "giusta": "art. 2106 c.c. e art. 7 St. lav.", "sbagliate": ["art. 2103 c.c.", "art. 2087 c.c.", "art. 2113 c.c."], "spiegazione": ""}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Quanti e quali sono i principi del procedimento disciplinare?", "giusta": "proporzionalità, niente tassatività, tempestività e contraddittorio", "sbagliate": ["tassatività, legalità e irretroattività", "proporzionalità e tassatività", "solo il contraddittorio"], "spiegazione": "Il prof ha chiamato il contraddittorio «il principio fondamentale»."}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Perché nel diritto disciplinare non vale la tassatività?", "giusta": "perché non si può prevedere tutto: basta che la condotta sia contraria al minimo etico", "sbagliate": ["perché lo vieta la Costituzione", "perché le sanzioni sono penali", "perché il codice disciplinare non è obbligatorio"], "spiegazione": ""}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Il principio di proporzionalità (art. 2106 c.c.) dice che la sanzione va data:", "giusta": "«secondo la gravità dell'infrazione»", "sbagliate": ["secondo l'anzianità del lavoratore", "secondo il danno economico all'impresa", "secondo la scelta del datore"], "spiegazione": "Per questo il licenziamento per un fatto punito dal contratto collettivo con una sanzione conservativa porta alla reintegra (art. 18, comma 4)."}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "La tempestività richiede che la contestazione sia immediata rispetto:", "giusta": "a quando il datore ha scoperto il fatto", "sbagliate": ["al giorno in cui il fatto è avvenuto", "alla fine del mese", "alla data delle giustificazioni"], "spiegazione": ""}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Quanto tempo ha il lavoratore per presentare le sue difese?", "giusta": "5 giorni dalla contestazione", "sbagliate": ["10 giorni", "48 ore", "30 giorni"], "spiegazione": "Nel contratto della ceramica dal ricevimento della contestazione."}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Il datore privato è obbligato a sentire personalmente il lavoratore?", "giusta": "solo se lo chiede o se lo prevede il contratto collettivo", "sbagliate": ["sempre", "mai", "solo per il licenziamento"], "spiegazione": "Nel pubblico impiego la data dell'audizione si fissa insieme alla contestazione."}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Quali sono i limiti di legge della multa e della sospensione (art. 7 St. lav.)?", "giusta": "multa fino a 4 ore di retribuzione, sospensione fino a 10 giorni", "sbagliate": ["multa fino a 3 ore, sospensione fino a 3 giorni", "multa fino a 8 ore, sospensione fino a 15 giorni", "multa fino a 4 ore, sospensione fino a 6 mesi"], "spiegazione": "3 ore e 3 giorni sono i limiti del contratto della ceramica."}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "La sospensione da 11 giorni a 6 mesi esiste:", "giusta": "solo nel pubblico impiego", "sbagliate": ["nel contratto della ceramica", "per i dirigenti privati", "in tutti i rapporti di lavoro"], "spiegazione": ""}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Il contratto collettivo può fissare per la sospensione un limite di 15 giorni?", "giusta": "no: può fissare limiti più bassi di quelli di legge, non più alti", "sbagliate": ["sì, il contratto collettivo prevale", "sì, se firmato dai sindacati più rappresentativi", "sì, ma solo per i quadri"], "spiegazione": "Sarebbe nulla in quella parte."}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Quale sanzione non richiede il procedimento dell'art. 7?", "giusta": "il rimprovero verbale", "sbagliate": ["il rimprovero scritto", "la multa", "la sospensione"], "spiegazione": ""}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Il licenziamento disciplinare per giusta causa è:", "giusta": "senza preavviso; quello per giustificato motivo soggettivo è con preavviso", "sbagliate": ["sempre con preavviso", "con preavviso; quello per giustificato motivo soggettivo è senza", "una sanzione conservativa"], "spiegazione": ""}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Possono essere sanzioni disciplinari il demansionamento e il trasferimento?", "giusta": "no: sono vietate le sanzioni che cambiano definitivamente il rapporto (art. 7, comma 4)", "sbagliate": ["sì, se previste dal codice disciplinare", "solo il trasferimento", "solo il demansionamento"], "spiegazione": "L'unica sanzione che cambia definitivamente il rapporto è il licenziamento."}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "Delle sanzioni disciplinari non si tiene conto dopo:", "giusta": "due anni: la recidiva conta solo entro il biennio", "sbagliate": ["un anno", "cinque anni", "sei mesi"], "spiegazione": ""}, {"tema": "Poteri del datore e potere disciplinare", "domanda": "La sanzione disciplinare si impugna davanti al collegio di conciliazione e arbitrato entro:", "giusta : "Rinunzie, prescrizione, trasferimento d'azienda, recesso", "domanda": "La prescrizione è:", "giusta": "l'estinzione del diritto per l'inerzia del titolare protratta nel tempo", "sbagliate": ["la perdita del diritto per non aver compiuto un atto nel termine", "un modo di impugnare il licenziamento", "la rinuncia al diritto"], "spiegazione": "La decadenza si impedisce solo compiendo l'atto nel termine."}, {"tema": "Rinunzie, prescrizione, trasferimento d'azienda, recesso", "domanda": "Nel trasferimento d'azienda (art. 2112 c.c.) il rapporto di lavoro:", "giusta": "continua con il cessionario, senza il consenso del lavoratore", "sbagliate": ["si estingue e va riassunto", "continua solo con il consenso del lavoratore", "resta con il cedente"], "spiegazione": "Cedente e cessionario sono obbligati in solido per i crediti maturati."}, {"tema": "Rinunzie, prescrizione, trasferimento d'azienda, recesso", "domanda": "Il preavviso di recesso (art. 2118 c.c.) è qualificato a lezione come:", "giusta": "un onere: chi non lo dà paga l'indennità sostitutiva", "sbagliate": ["un obbligo con efficacia reale", "un diritto del datore", "una sanzione"], "spiegazione": "Manuale e Cassazione: obbligo con efficacia solo obbligatoria. La sostanza è la stessa."}, {"tema": "Rinunzie, prescrizione, trasferimento d'azienda, recesso", "domanda": "La giusta causa (art. 2119 c.c.) è:", "giusta": "un fatto che non consente la prosecuzione nemmeno provvisoria del rapporto", "sbagliate": ["un motivo economico dell'azienda", "lo scarso rendimento", "la fine del comporto"], "spiegazione": "Il recesso è in tronco, senza preavviso."}]};
const D = DATI.domande.map(d=>({...d,id:d.domanda}));
const PER_ID = Object.fromEntries(D.map(d=>[d.id,d]));
const ULTIMA = D.map(d=>d.settimana||"").sort().pop()||"";
const NUOVE = ULTIMA?D.filter(d=>d.settimana===ULTIMA):[];
const TEMI = [...new Set(D.map(d=>d.tema))];
const CHIAVE = "quiz-lavoro-errori";
const app = document.getElementById("app");
let giro = null;

function leggiErrori(){ try{ return JSON.parse(localStorage.getItem(CHIAVE)||"[]"); }catch(e){ return []; } }
function scriviErrori(a){ try{ localStorage.setItem(CHIAVE, JSON.stringify(a)); }catch(e){} }
const CHIAVE_FATTE = CHIAVE.replace(/-errori$/,"")+"-fatte";
function leggiFatte(){ try{ return JSON.parse(localStorage.getItem(CHIAVE_FATTE)||'{"viste":[],"temi":{}}'); }catch(e){ return {viste:[],temi:{}}; } }
function scriviFatte(f){ try{ localStorage.setItem(CHIAVE_FATTE, JSON.stringify(f)); }catch(e){} }
function mescola(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function home(){
  giro = null;
  const err = leggiErrori().filter(id=>PER_ID[id]);
  const F = leggiFatte(), viste = new Set(F.viste);
  const temiFatti = TEMI.filter(t=>D.filter(d=>d.tema===t).every(d=>viste.has(d.id))).length;
  app.innerHTML = `
    <h1>${esc(DATI.materia)}</h1>
    <p class="sub">${esc(DATI.titolo)}: ${D.length} domande a risposta chiusa prese dal riassunto. Dopo ogni risposta vedi quella giusta e il perché.</p>
    <div class="modi">
      <button class="modo principale" data-m="sim"><div><b>Simulazione</b><span>30 domande a caso da tutti gli argomenti</span></div><span>→</span></button>
      ${NUOVE.length && NUOVE.length<D.length?`<button class="modo" data-m="nuove"><div><b>Questa settimana</b><span>le domande aggiunte il ${esc(ULTIMA.split("-").reverse().join("/"))}</span></div><span>${NUOVE.length}</span></button>`:""}
      <button class="modo" data-m="tutte"><div><b>Tutte le domande</b><span>in ordine casuale</span></div><span>${D.length}</span></button>
      <button class="modo" data-m="err" ${err.length?"":"disabled"}><div><b>Ripassa gli errori</b><span>${err.length?"le domande sbagliate finora":"ancora nessun errore salvato"}</span></div><span>${err.length||""}</span></button>
    </div>
    <h2>Per argomento · ${temiFatti} di ${TEMI.length} fatti</h2>
    <div class="temi">${TEMI.map((t,i)=>{ const dd=D.filter(d=>d.tema===t), fatte=dd.filter(d=>viste.has(d.id)).length, ok=fatte===dd.length, ult=F.temi[t];
      const info= ok ? `fatto${ult?` · ${ult.giuste}/${ult.n} giuste`:""}` : fatte ? `${fatte}/${dd.length} fatte` : `${dd.length} domande`;
      return `<button class="tema${ok?" fatto":""}" data-t="${i}"><span>${ok?'<span class="spunta" aria-label="fatto">✓</span>':""}${esc(t)}</span><small>${info}</small></button>`; }).join("")}</div>`;
  app.querySelectorAll(".modo").forEach(b=>b.onclick=()=>{
    const m=b.dataset.m;
    if(m==="sim") inizia(mescola(D).slice(0,30),"Simulazione");
    if(m==="tutte") inizia(mescola(D),"Tutte le domande");
    if(m==="nuove") inizia(mescola(NUOVE),"Questa settimana");
    if(m==="err") inizia(mescola(leggiErrori().filter(id=>PER_ID[id]).map(id=>PER_ID[id])),"Ripasso degli errori");
  });
  app.querySelectorAll(".tema").forEach(b=>b.onclick=()=>{ const t=TEMI[+b.dataset.t]; inizia(mescola(D.filter(d=>d.tema===t)),t); });
  window.scrollTo(0,0);
}

function inizia(lista,nome){
  giro = {lista:lista.map(d=>({d,opz:mescola([d.giusta,...d.sbagliate])})), nome, i:0, giuste:0, sbagliate:[]};
  mostra();
}

function mostra(){
  const g=giro, q=g.lista[g.i], n=g.lista.length;
  app.innerHTML = `
    <div class="testa"><span>${esc(g.nome)}</span><span>${g.i+1} / ${n} · ${g.giuste} giuste</span></div>
    <div class="barra"><i style="width:${(g.i)/n*100}%"></i></div>
    <div class="card">
      <span class="etichetta">${esc(q.d.tema)}</span>
      <p class="domanda">${esc(q.d.domanda)}</p>
      <div class="opzioni">${q.opz.map((o,k)=>`<button class="opz" data-k="${k}"><span class="l">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="esito"></div>
    </div>
    <div class="azioni"><button class="btn sec" id="esci">Torna all'inizio</button><span></span></div>`;
  app.querySelectorAll(".opz").forEach(b=>b.onclick=()=>rispondi(+b.dataset.k));
  document.getElementById("esci").onclick=home;
  window.scrollTo(0,0);
}

function rispondi(k){
  const g=giro, q=g.lista[g.i];
  if(q.data!==undefined) return;
  q.data=k;
  const scelta=q.opz[k], ok=scelta===q.d.giusta;
  const err=new Set(leggiErrori());
  if(ok){ g.giuste++; err.delete(q.d.id); } else { g.sbagliate.push({q,scelta}); err.add(q.d.id); }
  scriviErrori([...err]);
  const F=leggiFatte(); if(!F.viste.includes(q.d.id)){ F.viste.push(q.d.id); scriviFatte(F); }
  app.querySelectorAll(".opz").forEach(b=>{
    b.disabled=true; const o=q.opz[+b.dataset.k];
    if(o===q.d.giusta) b.classList.add("giusta"); else if(+b.dataset.k===k) b.classList.add("sbagliata");
  });
  const sp=q.d.spiegazione?`<div>${esc(q.d.spiegazione)}</div>`:"";
  document.getElementById("esito").innerHTML = ok
    ? `<div class="esito ok"><b>Giusto</b>${sp}</div>`
    : `<div class="esito ko"><b>Sbagliato. Era: ${esc(q.d.giusta)}</b>${sp}</div>`;
  const ultima=g.i===g.lista.length-1;
  const az=app.querySelector(".azioni span");
  az.outerHTML=`<button class="btn" id="avanti">${ultima?"Vedi il risultato":"Avanti →"}</button>`;
  document.getElementById("avanti").onclick=()=>{ if(ultima) fine(); else { g.i++; mostra(); } };
  document.getElementById("avanti").focus({preventScroll:true});
  app.querySelector(".testa span:last-child").textContent=`${g.i+1} / ${g.lista.length} · ${g.giuste} giuste`;
}

function fine(){
  const g=giro, n=g.lista.length, pct=Math.round(g.giuste/n*100);
  if(TEMI.includes(g.nome)){ const F=leggiFatte(); F.temi[g.nome]={giuste:g.giuste,n,data:new Date().toISOString().slice(0,10)}; scriviFatte(F); }
  const giudizio = pct>=90?"Ottimo.":pct>=75?"Buono: ripassa le poche sbagliate.":pct>=60?"Sufficiente: guarda bene gli errori qui sotto.":"Da ripassare: rileggi gli argomenti delle domande sbagliate.";
  app.innerHTML = `
