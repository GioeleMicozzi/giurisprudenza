<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Quiz Diritto romano</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1f24; --muted:#636873; --line:#e2ded5;
  --accent:#2f5d8a; --accent-ink:#ffffff; --soft:#e9eff6;
  --ok:#1f7a4a; --ok-bg:#e3f3ea; --ko:#b23a32; --ko-bg:#f9e4e2;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171b; --card:#1f2228; --ink:#eceef2; --muted:#a2a8b3; --line:#30343c;
    --accent:#7fb0e0; --accent-ink:#0f1720; --soft:#22303f;
    --ok:#6fd19a; --ok-bg:#183527; --ko:#f08a80; --ko-bg:#3d1f1d;
  }
}
:root[data-theme="dark"]{
  --bg:#15171b; --card:#1f2228; --ink:#eceef2; --muted:#a2a8b3; --line:#30343c;
  --accent:#7fb0e0; --accent-ink:#0f1720; --soft:#22303f;
  --ok:#6fd19a; --ok-bg:#183527; --ko:#f08a80; --ko-bg:#3d1f1d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:1.45rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.modi{display:grid;gap:10px;margin-bottom:22px}
.modo{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font:inherit;cursor:pointer}
.modo:hover{border-color:var(--accent)}
.modo b{display:block;font-size:1.02rem}
.modo span{color:var(--muted);font-size:.9rem}
.modo.principale{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.modo.principale span{color:inherit;opacity:.85}
.modo[disabled]{opacity:.5;cursor:default}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
.temi{display:grid;gap:6px}
.tema{display:flex;justify-content:space-between;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;text-align:left;padding:10px 2px;cursor:pointer}
.tema:hover{color:var(--accent)}
.tema small{color:var(--muted);white-space:nowrap}
.barra{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.barra i{display:block;height:100%;background:var(--accent);transition:width .2s}
.testa{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.88rem}
.etichetta{display:inline-block;background:var(--soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600;margin-bottom:10px}
.domanda{font-size:1.15rem;font-weight:600;margin:0 0 16px;line-height:1.4}
.opzioni{display:grid;gap:9px}
.opz{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;line-height:1.4}
.opz:hover:not([disabled]){border-color:var(--accent)}
.opz .l{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:-1px}
.opz[disabled]{cursor:default}
.opz.giusta{border-color:var(--ok);background:var(--ok-bg)}
.opz.giusta .l{background:var(--ok);color:var(--card)}
.opz.sbagliata{border-color:var(--ko);background:var(--ko-bg)}
.opz.sbagliata .l{background:var(--ko);color:var(--card)}
.esito{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.95rem}
.esito.ok{background:var(--ok-bg);color:var(--ink);border-left:4px solid var(--ok)}
.esito.ko{background:var(--ko-bg);color:var(--ink);border-left:4px solid var(--ko)}
.esito b{display:block;margin-bottom:2px}
.azioni{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.punti{font-size:2.6rem;font-weight:700;margin:4px 0;letter-spacing:-.02em}
.voto{color:var(--muted);margin:0 0 14px}
.errore{border-top:1px solid var(--line);padding:12px 0}
.errore p{margin:0 0 4px}
.errore .tua{color:var(--ko)}
.errore .ok{color:var(--ok);font-weight:600}
.errore .sp{color:var(--muted);font-size:.92rem}
.nota{color:var(--muted);font-size:.85rem;margin-top:22px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

<script>
const DATI = {"materia": "Diritto romano", "titolo": "Quiz di Diritto romano (capp. I-IV)", "domande": [{"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Come definisce il diritto Celso?", "giusta": "ars boni et aequi: la tecnica del buono e del giusto", "sbagliate": ["ius est quod iussum est: ciò che è comandato", "la volontà costante di dare a ciascuno il suo", "l'insieme delle leggi votate nei comizi"], "spiegazione": "È l'unica definizione romana del diritto (II sec. d.C.)."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "In quanti periodi si divide la storia del diritto romano, dalla fondazione di Roma alla morte di Giustiniano?", "giusta": "cinque: arcaico, preclassico, classico, postclassico, giustinianeo", "sbagliate": ["tre: regio, repubblicano, imperiale", "quattro: arcaico, classico, postclassico, bizantino", "due: diritto civile e diritto pretorio"], "spiegazione": "Circa 13 secoli, dal 754-753 a.C. al 565 d.C."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Quale evento segna, nel 367 a.C., la fine del periodo arcaico?", "giusta": "le leggi Licinie Sestie", "sbagliate": ["la Legge delle XII tavole", "la lex Hortensia", "l'istituzione del pretore peregrino"], "spiegazione": "Le leggi Licinie Sestie creano la pretura. Il pretore amministra la giustizia fra cittadini romani; il peregrino arriva nel 242 a.C."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Quando inizia e finisce il periodo classico?", "giusta": "da Augusto (27 a.C.) alla fine dei Severi (235 d.C.)", "sbagliate": ["dal 242 a.C. alla morte di Augusto", "dal 367 a.C. al 212 d.C.", "da Adriano alla legge delle citazioni"], "spiegazione": "Inizia con la «silenziosa rivoluzione» di Augusto e il principato."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Che cosa fa la Constitutio Antoniniana del 212 d.C.?", "giusta": "estende la cittadinanza a quasi tutti", "sbagliate": ["rende definitivo l'editto del pretore", "abolisce le legis actiones", "introduce la legge delle citazioni"], "spiegazione": "La cittadinanza romana a quasi tutti gli abitanti dell'impero. È di Antonino Caracalla; fa cadere anche la distinzione fra istituti dei Romani e di tutti i popoli."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Che differenza c'è fra fonti di produzione e fonti di cognizione?", "giusta": "le prime pongono le norme, le seconde permettono di conoscerle", "sbagliate": ["le prime sono scritte, le seconde orali", "le prime valgono per i cittadini, le seconde per gli stranieri", "le prime sono del pretore, le seconde dei giuristi"], "spiegazione": "Fonti di cognizione principali: le Istituzioni di Gaio e il Corpus iuris."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Una legge che vieta un atto, e se l'atto viene compiuto lo annulla, è una lex:", "giusta": "perfecta", "sbagliate": ["minus quam perfecta", "imperfecta", "rogata"], "spiegazione": "Minus quam perfecta: non annulla ma punisce; imperfecta: né annulla né punisce."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Che cos'è il plebiscito?", "giusta": "la deliberazione della plebe nel concilium plebis, su proposta del tribuno", "sbagliate": ["la legge votata dal popolo nei comizi su proposta del console", "il parere del senato al magistrato", "la risposta dell'imperatore a un privato"], "spiegazione": "Dalla lex Hortensia (286 a.C.) vincola tutto il popolo."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Da quale data i plebisciti vincolano tutto il popolo e non solo i plebei?", "giusta": "dal 286 a.C., con la lex Hortensia", "sbagliate": ["dal 449 a.C., con le XII tavole", "dal 367 a.C., con le leggi Licinie Sestie", "dal 27 a.C., con Augusto"], "spiegazione": "Dagli appunti, Cap. I · Diritto e fonti."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Quando viene emanata la Legge delle XII tavole?", "giusta": "nel 449 a.C., da un collegio di dieci membri (decemviri)", "sbagliate": ["nel 754 a.C., alla fondazione di Roma", "nel 367 a.C., con la pretura", "nel 130 d.C., sotto Adriano"], "spiegazione": "È il primo punto fermo del diritto romano; il testo originale non ci è giunto."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Nel diritto più antico, a chi spetta l'interpretazione dello ius civile?", "giusta": "ai pontefici", "sbagliate": ["al pretore urbano", "ai giuristi muniti di ius respondendi", "al senato"], "spiegazione": "Ceto patrizio, indirizzo conservatore: per l'evoluzione si dovrà attendere la laicizzazione della giurisprudenza."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Il pretore, nel sistema romano:", "giusta": "annuncia nell'editto come giudicherà", "sbagliate": ["è il giudice che pronuncia la sentenza", "può abrogare le leggi del popolo", "è un privato scelto dalle parti"], "spiegazione": "Non è giudice né legislatore. Non emette sentenze e non fa leggi, ma corregge e integra lo ius civile con mezzi processuali."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Che cos'è l'edictum repentinum?", "giusta": "l'editto emanato dal pretore in corso d'anno per particolari esigenze", "sbagliate": ["l'editto reso definitivo da Salvio Giuliano", "l'editto dell'imperatore valido per i successori", "l'editto del pretore peregrino"], "spiegazione": "Dagli appunti, Cap. I · Diritto e fonti."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Chi dà all'editto la forma definitiva (edictum perpetuum) e quando?", "giusta": "Salvio Giuliano, sotto Adriano, nel 130 d.C. circa", "sbagliate": ["Gaio, sotto Antonino Pio", "Triboniano, sotto Giustiniano", "Labeone, sotto Augusto"], "spiegazione": "Da allora ogni attività normativa va ricondotta al principe."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Perché nasce il processo per formulas?", "giusta": "formalismo e chiusura agli stranieri", "sbagliate": ["per sostituire il pretore con un giudice pubblico", "per abolire la distinzione fra fase in iure e apud iudicem", "per volontà di Giustiniano"], "spiegazione": "Le legis actiones erano troppo formalistiche e non utilizzabili dagli stranieri. Gaio indica il formalismo; decisivo fu l'affiancamento del pretore peregrino."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Con quale strumento il pretore tutela l'ordine successorio che lo ius civile non prevede?", "giusta": "la bonorum possessio", "sbagliate": ["l'hereditas", "la manus iniectio", "la cessio bonorum"], "spiegazione": "Non può cambiare la nozione di erede, ma crea situazioni analoghe e le difende."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Quale fra queste NON è una costituzione imperiale?", "giusta": "il senatoconsulto", "sbagliate": ["l'editto", "il rescritto", "il decreto"], "spiegazione": "Costituzioni: edicta, mandata, decreta, rescripta, epistulae."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Il rescritto imperiale è:", "giusta": "la risposta dell'imperatore a quesiti scritti presentati da privati", "sbagliate": ["la risposta a una richiesta di funzionari o magistrati", "la pronuncia dell'imperatore come giudice", "l'istruzione dell'imperatore ai governatori"], "spiegazione": "L'epistula risponde a funzionari; il decretum è la decisione giudiziaria; i mandata sono istruzioni."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "I mandata sono:", "giusta": "istruzioni dell'imperatore ai suoi funzionari e ai governatori delle province", "sbagliate": ["pareri del senato al magistrato", "risposte dei giuristi ai privati", "contratti di mandato fra privati"], "spiegazione": "Poi raccolti in un liber mandatorum."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Quale ultima legge comiziale ricordano le fonti?", "giusta": "una legge di Nerva del 96 d.C.", "sbagliate": ["le leges Iuliae di Augusto", "la lex Hortensia", "la Constitutio Antoniniana"], "spiegazione": "Nel principato le leggi comiziali si esauriscono."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Quali sono le tre attività del giurista indicate dai verbi respondere, agere, cavere?", "giusta": "dare responsi, assistere nel processo, predisporre gli atti negoziali", "sbagliate": ["legiferare, giudicare, eseguire", "insegnare, scrivere, interpretare", "accusare, difendere, decidere"], "spiegazione": "Dagli appunti, Cap. I · Diritto e fonti."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "A chi si attribuisce la nascita della letteratura giuridica?", "giusta": "a Sesto Elio", "sbagliate": ["a Quinto Mucio Scevola", "a Gaio", "a Pomponio"], "spiegazione": "A Sesto Elio, con i Tripertita (198 a.C.). Tre parti: XII tavole, interpretazione, tutela processuale."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Chi introduce lo ius publice respondendi?", "giusta": "Augusto", "sbagliate": ["Adriano", "Giustiniano", "Valentiniano III"], "spiegazione": "Il diritto di dare responsi con l'autorità dell'imperatore."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Sabiniani e Proculiani: quale abbinamento è giusto?", "giusta": "Sabiniani da Capitone (conservatori), Proculiani da Labeone (progressisti)", "sbagliate": ["Sabiniani da Labeone, Proculiani da Capitone", "entrambe le scuole da Salvio Giuliano", "Sabiniani da Celso, Proculiani da Gaio"], "spiegazione": "Gaio è sabiniano, Celso proculiano."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Perché le Istituzioni di Gaio sono così importanti?", "giusta": "è l'unica opera classica giunta a parte", "sbagliate": ["sono la prima legge scritta di Roma", "contengono l'editto perpetuo", "sono state scritte da Giustiniano"], "spiegazione": "È l'unica opera della giurisprudenza classica giunta fuori dalla compilazione giustinianea. Quattro commentari: persone, cose, azioni."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Secondo la legge delle citazioni, se i cinque giuristi sono in parità prevale:", "giusta": "Papiniano", "sbagliate": ["Gaio", "Ulpiano", "il giudice, che sceglie liberamente"], "spiegazione": "Valentiniano III, 426 d.C.: Papiniano, Paolo, Gaio, Ulpiano, Modestino; vince la maggioranza."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Codice Gregoriano ed Ermogeniano sono:", "giusta": "raccolte di costituzioni imperiali del 292-294 d.C.", "sbagliate": ["raccolte di scritti dei giuristi", "le prime codificazioni di Giustiniano", "commentari all'editto"], "spiegazione": "Compare per la prima volta il termine codex."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Il Codice Teodosiano entra in vigore:", "giusta": "nel 439 d.C., in 16 libri", "sbagliate": ["nel 429 d.C., in 50 libri", "nel 529 d.C., in 12 libri", "nel 534 d.C., in 4 libri"], "spiegazione": "Previsto da Teodosio II nel 429."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Il Digesto è composto da:", "giusta": "50 libri, entra in vigore il 30 dicembre 533", "sbagliate": ["12 libri, entra in vigore nel 534", "4 libri, pubblicato nel novembre 533", "16 libri, entra in vigore nel 439"], "spiegazione": "Commissione guidata da Triboniano, costituzione Deo auctore (530); pubblicazione con Tanta-Dédoken."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Chi presiede la commissione che compila il Digesto?", "giusta": "Triboniano", "sbagliate": ["Teofilo", "Salvio Giuliano", "Papiniano"], "spiegazione": "Dagli appunti, Cap. I · Diritto e fonti."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Le Istituzioni di Giustiniano:", "giusta": "sono in 4 libri, destinate agli studenti, e hanno valore di legge", "sbagliate": ["sono in 50 libri e raccolgono i responsi dei giuristi", "sono in 12 libri e raccolgono costituzioni", "non hanno valore di legge, solo didattico"], "spiegazione": "Pubblicate nel novembre 533."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Il Codex repetitae praelectionis:", "giusta": "sostituisce il primo Codice (534)", "sbagliate": ["è il primo codice di Giustiniano, del 529", "raccoglie le Novelle", "è la raccolta di Teodosio II"], "spiegazione": "Entra in vigore il 29 dicembre 534, in 12 libri. È l'unico codice giustinianeo giunto fino a noi."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Le Novelle giustinianee:", "giusta": "sono raccolte private delle costituzioni successive al Codice", "sbagliate": ["sono state ordinate da Giustiniano come quarta parte ufficiale", "sono gli scritti dei giuristi classici", "sono le istruzioni ai funzionari"], "spiegazione": "Tre raccolte: Epitome di Giuliano, Authenticum latino, Collezione greca."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "I diritti assoluti si distinguono dai relativi perché:", "giusta": "i primi valgono verso tutti", "sbagliate": ["valgono solo per i cittadini", "sono previsti dallo ius civile e non dal pretore", "non si possono trasmettere agli eredi"], "spiegazione": "Impongono a tutti un dovere di astensione; i relativi un obbligo a un soggetto determinato. Assoluti: potestà e diritti reali; relativi: obbligazioni."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Lo ius singulare:", "giusta": "deroga ai principi per utilità", "sbagliate": ["è il diritto comune a tutti i popoli", "è la norma che beneficia un singolo individuo", "è il diritto del pretore"], "spiegazione": "Non si applica per analogia. Il beneficio per singoli individui è il privilegium."}, {"tema": "Cap. I · Diritto e fonti", "settimana": "2026-11-23", "domanda": "Nella tripartizione giustinianea, lo ius naturale è:", "giusta": "il diritto insegnato dalla natura, immutabile", "sbagliate": ["il diritto proprio di ciascun popolo", "il diritto comune a tutti gli uomini", "il diritto creato dal pretore"], "spiegazione": "Ius civile: di ciascun popolo; ius gentium: comune a tutti gli uomini."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Per i Romani «persona» indica:", "giusta": "l'essere umano", "sbagliate": ["il soggetto di diritto", "solo il cittadino romano", "solo il pater familias"], "spiegazione": "Le nozioni di capacità giuridica e di agire non sono romane."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Per i Proculiani la prova che il nato era vivo è:", "giusta": "il vagito", "sbagliate": ["qualunque manifestazione di vita", "la forma umana", "il riconoscimento del padre"], "spiegazione": "Per i Sabiniani (e Giustiniano) basta qualunque manifestazione di vita."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "A tutela dei beni del concepito si nomina:", "giusta": "un curatore del ventre", "sbagliate": ["un tutore testamentario", "un curatore del prodigo", "un cognitor"], "spiegazione": "Il concepito è considerato già nato quando gli giova."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "La capitis deminutio media si ha quando:", "giusta": "si perde la cittadinanza", "sbagliate": ["si perde la libertà", "si cambia famiglia, per esempio con l'adozione", "si raggiunge la pubertà"], "spiegazione": "Maxima: perdita della libertà; minima: mutamento dello status familiare."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Quali sono i tre status necessari per la piena capacità?", "giusta": "libertà, cittadinanza, essere sui iuris", "sbagliate": ["libertà, pubertà, matrimonio", "cittadinanza, patrimonio, sesso maschile", "nascita, vita, forma umana"], "spiegazione": "Nascita, vita e forma umana sono i requisiti dell'esistenza, non della capacità."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "La fondazione è:", "giusta": "un patrimonio senza titolare destinato a uno scopo duraturo", "sbagliate": ["un'associazione di persone con diritti distinti dai membri", "il patrimonio ereditario in attesa dell'erede", "un collegio di sacerdoti"], "spiegazione": "La corporazione invece è su base associativa."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Il senatoconsulto Silaniano:", "giusta": "dispone la tortura degli schiavi sotto lo stesso tetto del padrone ucciso", "sbagliate": ["vieta di usare gli schiavi negli spettacoli", "libera lo schiavo malato abbandonato", "punisce chi uccide senza motivo il proprio servo"], "spiegazione": "Gli spettacoli: legge Petronia; lo schiavo malato: Claudio; l'uccisione: rescritto di Antonino Pio."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Il peculio è:", "giusta": "beni lasciati in uso allo schiavo", "sbagliate": ["il prezzo pagato per liberare lo schiavo", "la dote della moglie", "la somma promessa nel sacramentum"], "spiegazione": "Un patrimonio lasciato dal padrone alla disponibilità dello schiavo. Con esso il servo negozia con i terzi; spesso compra la propria libertà."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "L'actio institoria si dà contro il padrone:", "giusta": "che ha preposto lo schiavo a una bottega o a un commercio", "sbagliate": ["che ha affidato allo schiavo il comando di una nave", "che ha autorizzato un singolo debito del servo", "per i soli debiti nei limiti del peculio"], "spiegazione": "Nave: exercitoria; autorizzazione: quod iussu; peculio: de peculio."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "L'actio de in rem verso è nei limiti di:", "giusta": "dell'arricchimento del padrone", "sbagliate": ["tutto il patrimonio del padrone", "l'attivo del peculio", "il doppio del danno"], "spiegazione": "Quanto il ricavo dell'affare è entrato nel patrimonio del padrone. La de peculio è fino all'ammontare dell'attivo del peculio."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Per lo status del figlio, che cosa conta?", "giusta": "la condizione della madre", "sbagliate": ["la condizione del padre al concepimento", "la condizione del padre alla nascita", "la scelta del pater familias"], "spiegazione": "Per Giustiniano conta il momento più favorevole al figlio. Dagli appunti, Cap. II · Persone e famiglia."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Lo ius postliminii riguarda:", "giusta": "il ritorno del prigioniero", "sbagliate": ["lo schiavo liberato per testamento", "lo straniero che diventa cittadino", "il figlio emancipato"], "spiegazione": "Il cittadino caduto prigioniero, che al ritorno riacquista i suoi diritti. Se muore in prigionia, la fictio legis Corneliae lo considera morto al momento della cattura."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Quali sono i tre modi di manumissione «giusta e legittima»?", "giusta": "testamento, vindicta, censu", "sbagliate": ["testamento, in ecclesia, adozione", "vindicta, mancipatio, usus", "censu, stipulatio, traditio"], "spiegazione": "In ecclesia e per adozione sono forme del periodo cristiano."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "La manumissio vindicta consiste in:", "giusta": "un finto processo davanti al pretore", "sbagliate": ["l'iscrizione del servo nelle liste del censimento", "una dichiarazione davanti ai fedeli", "una clausola del testamento"], "spiegazione": "Un adsertor dichiara libero il servo e il padrone non replica. Dagli appunti, Cap. II · Persone e famiglia."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Chi è liberato con forme non solenni, secondo la legge Iunia Norbana, diventa:", "giusta": "latino giuniano", "sbagliate": ["cittadino romano", "peregrino dediticio", "ingenuo"], "spiegazione": "Alla sua morte i beni vanno al padrone."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "La legge Fufia Caninia:", "giusta": "limita il numero di schiavi liberabili per testamento", "sbagliate": ["vieta le liberazioni in frode ai creditori", "fissa a 20 anni l'età del manomissore", "rende latini gli schiavi liberati informalmente"], "spiegazione": "Giustiniano la abroga; la Aelia Sentia riguarda le manumissioni fra vivi."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Che cosa resta della legge Aelia Sentia con Giustiniano?", "giusta": "il divieto di frode e il limite d'età", "sbagliate": ["tutta la legge, invariata", "solo la condizione di peregrino dediticio", "nulla: viene abrogata del tutto"], "spiegazione": "Il limite d'età del manomissore scende a 14 anni. Dagli appunti, Cap. II · Persone e famiglia."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Quale di questi NON è un potere del pater familias?", "giusta": "il diritto di imporre il matrimonio al figlio contro la sua volontà", "sbagliate": ["il diritto di esporre il figlio", "il diritto di vendere il figlio", "il diritto di dare il figlio a nossa"], "spiegazione": "I tre poteri principali: esporre, vendere, dare a nossa (ius vitae ac necis)."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Con Giustiniano, la noxae deditio:", "giusta": "resta per gli schiavi ma non per i figli", "sbagliate": ["resta per i figli e per gli schiavi", "è abolita del tutto", "vale solo per i figli emancipati"], "spiegazione": "Dagli appunti, Cap. II · Persone e famiglia."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Per le XII tavole, come si emancipa il figlio?", "giusta": "con tre vendite del figlio", "sbagliate": ["con una dichiarazione davanti al pretore", "con un rescritto imperiale", "con il compimento dei 25 anni"], "spiegazione": "Con Giustiniano: per rescritto o davanti al giudice, con il consenso del figlio."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Nella concezione classica il consenso matrimoniale è:", "giusta": "continuo: la maritalis affectio deve durare", "sbagliate": ["iniziale: basta al momento delle nozze", "irrilevante: conta la copula", "presunto per legge dopo un anno"], "spiegazione": "Nel postclassico diventa iniziale, e così si limita il divorzio."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "La confarreatio:", "giusta": "il rito più antico e solenne", "sbagliate": ["è un adattamento della mancipatio", "è l'acquisto della manus dopo un anno di convivenza", "è il fidanzamento con caparra"], "spiegazione": "Riservato ai ceti alti, con Pontefice massimo e Flamine di Giove. La coemptio adatta la mancipatio; l'usus è un'usucapione della manus."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Il trinoctium serve a:", "giusta": "impedire che il marito acquisti la manus per usus", "sbagliate": ["sciogliere il matrimonio", "celebrare il matrimonio con la confarreatio", "legittimare un figlio naturale"], "spiegazione": "La moglie sta fuori casa tre notti l'anno."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Quale NON è un requisito del matrimonio iustum?", "giusta": "la manus del marito", "sbagliate": ["la pubertà", "il consenso delle parti", "il conubium"], "spiegazione": "Dal II sec. a.C. si afferma il matrimonio sine manu."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Le leggi Iulia e Papia Poppaea di Augusto:", "giusta": "obbligano a sposarsi", "sbagliate": ["vietano il divorzio", "rendono obbligatoria la manus", "aboliscono il conubium"], "spiegazione": "Penalizzano celibi e coppie senza figli. Servono a incrementare la popolazione."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Il divorzio voluto da uno solo dei coniugi si chiama:", "giusta": "ripudio", "sbagliate": ["divortium", "diffarreatio", "capitis deminutio"], "spiegazione": "Costantino punisce il ripudio senza gravi cause."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "La tutela atiliana (dativa):", "giusta": "è nominata dal magistrato", "sbagliate": ["è affidata agli agnati più vicini", "è disposta nel testamento", "spetta sempre alla madre"], "spiegazione": "Interviene per interesse pubblico quando manca un tutore testamentario o legittimo. Dagli appunti, Cap. II · Persone e famiglia."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "Il pupillo che, uscito dall'infanzia, compie un negozio senza l'auctoritas del tutore:", "giusta": "ne trae i vantaggi ma non gli svantaggi", "sbagliate": ["compie un negozio nullo in ogni caso", "resta obbligato come un adulto", "vincola il tutore"], "spiegazione": "Nella compravendita si obbliga solo la controparte."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "L'accusatio suspecti tutoris (accusa di cattiva gestione):", "giusta": "può portare alla rimozione del tutore, fino all'infamia", "sbagliate": ["è un'azione penale nel doppio", "obbliga il tutore a una cauzione", "regola i rapporti reciproci fra pupillo e tutore"], "spiegazione": "Nel doppio: actio de rationibus distrahendis; rapporti reciproci: actio tutelae."}, {"tema": "Cap. II · Persone e famiglia", "settimana": "2026-11-23", "domanda": "La venia aetatis permette:", "giusta": "al maschio di 20 anni e alla femmina di 18 di amministrare da soli prima dei 25", "sbagliate": ["al pupillo di sposarsi prima della pubertà", "al tutore di rinunciare all'incarico", "al figlio di uscire dalla patria potestà"], "spiegazione": "La cura dei minori dura fino a 25 anni."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Come si succedono i tre tipi di processo romano?", "giusta": "legis actiones, processo formulare, cognitio extra ordinem", "sbagliate": ["processo formulare, legis actiones, cognitio extra ordinem", "cognitio extra ordinem, legis actiones, processo formulare", "legis actiones, cognitio extra ordinem, processo formulare"], "spiegazione": "Dagli appunti, Cap. III · Difesa dei diritti."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Quale legis actio è generica e dichiarativa?", "giusta": "sacramento", "sbagliate": ["per condictionem", "per manus iniectionem", "per pignoris capionem"], "spiegazione": "Manus iniectio: generica ed esecutiva; pignoris capio: specifica ed esecutiva."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Perché Gaio definisce «pericolosa» la legis actio sacramento?", "giusta": "il soccombente paga una somma all'erario", "sbagliate": ["il convenuto poteva essere ucciso", "il giudice poteva condannare a una pena corporale", "si perdeva la cittadinanza"], "spiegazione": "È la scommessa che dà il nome all'azione."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Nella legis actio per condictionem, se il convenuto nega, l'attore:", "giusta": "lo intima di tornare davanti al pretore dopo 30 giorni", "sbagliate": ["lo porta via in catene", "chiede subito un giudice", "prende in pegno i suoi beni"], "spiegazione": "Riguarda crediti di cose determinate, senza rischio di pena."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Nella manus iniectio iudicati, che cosa succede al condannato che non paga e non trova un garante?", "giusta": "diventa addictus", "sbagliate": ["perde solo i beni", "viene esiliato", "viene messo in carcere pubblico"], "spiegazione": "Dopo 60 giorni può essere venduto come schiavo o ucciso. La lex Poetelia Papiria lo fa lavorare per il creditore fino al pagamento."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Quale legge abroga definitivamente le legis actiones?", "giusta": "la lex Iulia iudiciorum privatorum", "sbagliate": ["la lex Aebutia", "la lex Poetelia Papiria", "la lex Hortensia"], "spiegazione": "Nel 17 a.C. Dagli appunti, Cap. III · Difesa dei diritti."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "La litis contestatio:", "giusta": "chiude la fase in iure e fissa i termini della controversia", "sbagliate": ["è la sentenza del giudice privato", "è la chiamata in giudizio del convenuto", "è l'appello contro la sentenza"], "spiegazione": "Vale il principio bis de eadem re ne sit actio."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Lo schiavo oggetto della lite muore dopo la litis contestatio e prima della sentenza. Il giudice:", "giusta": "condanna al valore dello schiavo", "sbagliate": ["deve assolvere perché l'oggetto non c'è più", "deve dichiarare estinto il processo", "rinvia al pretore"], "spiegazione": "Può comunque condannare al valore dello schiavo. È l'effetto conservativo: la litis contestatio «fotografa» la situazione."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Il convenuto soddisfa l'attore dopo la litis contestatio. Secondo i Sabiniani:", "giusta": "va assolto: omnia iudicia absolutoria", "sbagliate": ["va condannato comunque", "il processo si annulla", "deve pagare il doppio"], "spiegazione": "I Proculiani dicevano che andava condannato."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "La litis contestatio ha effetto estintivo ipso iure quando:", "giusta": "legittimo, in personam, in ius", "sbagliate": ["l'azione è in rem", "la formula è in factum", "il giudizio è imperio continens"], "spiegazione": "Giudizio legittimo, azione in personam, formula in ius concepta. Negli altri casi l'effetto è preclusivo, ope exceptionis (exceptio rei iudicatae vel in iudicium deductae)."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Nel processo formulare la sentenza:", "giusta": "è inappellabile e di regola condanna a una somma di denaro", "sbagliate": ["è appellabile davanti al pretore", "condanna sempre alla restituzione della cosa", "è pronunciata dal pretore"], "spiegazione": "La condanna pecuniaria si evita con la clausola arbitraria."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Quale parte della formula esprime la pretesa dell'attore?", "giusta": "l'intentio", "sbagliate": ["la demonstratio", "l'adiudicatio", "la condemnatio"], "spiegazione": "Demonstratio: espone il fatto; adiudicatio: attribuisce cose nei giudizi divisori."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "In quali giudizi si trova l'adiudicatio?", "giusta": "nei giudizi divisori", "sbagliate": ["nelle azioni penali", "nelle azioni di buona fede", "nelle azioni popolari"], "spiegazione": "Nei giudizi divisori e di regolamento dei confini. Dagli appunti, Cap. III · Difesa dei diritti."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Che cosa succede se l'attore incorre nella plus petitio nell'intentio?", "giusta": "perde la causa", "sbagliate": ["ottiene solo quanto dovuto", "può correggere la formula", "paga una multa ma vince"], "spiegazione": "Se chiede meno, ci sono rimedi."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "La praescriptio è nell'interesse:", "giusta": "dell'attore, per limitare l'oggetto della lite (per esempio alle rate scadute)", "sbagliate": ["del convenuto, per paralizzare la pretesa", "del giudice, per limitare i suoi poteri", "del pretore, per escludere l'azione"], "spiegazione": "Si scrive all'inizio della formula."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Dove si inserisce l'exceptio nella formula?", "giusta": "fra l'intentio e la condemnatio", "sbagliate": ["prima della demonstratio", "dopo la condemnatio", "al posto dell'intentio"], "spiegazione": "È un mezzo di difesa del convenuto rilevante per il diritto pretorio."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Un'eccezione che si può opporre solo entro un certo tempo (es. patto di non chiedere per 5 anni) è:", "giusta": "dilatoria", "sbagliate": ["perentoria", "replicatio", "duplicatio"], "spiegazione": "Le perentorie bloccano sempre la pretesa (patto di non chiedere più, dolo)."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "La clausola arbitraria consente:", "giusta": "al convenuto di evitare la condanna pecuniaria restituendo la cosa", "sbagliate": ["al giudice di decidere secondo equità", "all'attore di chiedere più del dovuto", "alle parti di scegliere un arbitro"], "spiegazione": "Se non restituisce, la somma la fissa l'attore con giuramento (iusiurandum in litem)."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Con la fictio il pretore:", "giusta": "ordina al giudice di dare per esistente un requisito del diritto civile", "sbagliate": ["finge che il processo non sia avvenuto", "finge che il convenuto sia assente", "sostituisce una parte con un rappresentante"], "spiegazione": "Es. actio Publiciana: si finge compiuta l'usucapione."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Le azioni miste:", "giusta": "uniscono reintegrazione e pena", "sbagliate": ["sono insieme civili e pretorie", "valgono sia in rem sia in personam", "spettano a qualunque cittadino"], "spiegazione": "Chi nega è condannato nel doppio. Reipersecutorie: solo reintegrazione; penali: solo pena."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Le azioni di buona fede:", "giusta": "danno al giudice ampia discrezionalità", "sbagliate": ["impongono una valutazione di stretto diritto", "sono sempre azioni penali", "sono azioni in rem"], "spiegazione": "Può tener conto di patti, interessi, controcrediti. Si contrappongono alle azioni di stretto diritto."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Che differenza c'è fra cognitor e procurator?", "giusta": "il primo è nominato solennemente", "sbagliate": ["il cognitor rappresenta il convenuto, il procurator l'attore", "il procurator è nominato dal pretore", "non c'è differenza"], "spiegazione": "Il procurator invece informalmente. Entrambi danno luogo a formule con trasposizione di soggetti."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Le azioni popolari:", "giusta": "tutelano un interesse pubblico", "sbagliate": ["sono le azioni del popolo romano come Stato", "spettano solo ai magistrati", "sono azioni di buona fede"], "spiegazione": "Sono azioni penali date a ogni cittadino. La condanna è a favore dell'attore."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Un interdetto che ordina di esibire un documento o una persona è:", "giusta": "esibitorio", "sbagliate": ["proibitorio", "restitutorio", "duplice"], "spiegazione": "Proibitorio: vieta; restitutorio: impone di restituire o ripristinare."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "La restitutio in integrum:", "giusta": "ripristina la situazione precedente", "sbagliate": ["condanna nel quadruplo", "immette nel possesso dei beni del debitore", "è una promessa imposta dal pretore"], "spiegazione": "Dopo un negozio valido per il diritto civile ma iniquo. Dagli appunti, Cap. III · Difesa dei diritti."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Il mezzo di coazione più forte del pretore è:", "giusta": "la missio in bona o in possessionem", "sbagliate": ["la stipulatio praetoria", "l'interdetto proibitorio", "la restitutio in integrum"], "spiegazione": "Dagli appunti, Cap. III · Difesa dei diritti."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "Nella bonorum venditio, il bonorum emptor:", "giusta": "succede in blocco nei rapporti attivi e passivi del debitore", "sbagliate": ["acquista solo i beni mobili", "diventa erede del debitore", "paga i creditori per intero"], "spiegazione": "Ha l'actio Rutiliana (debitore vivo) e la Serviana (debitore morto); il debitore subisce l'infamia."}, {"tema": "Cap. III · Difesa dei diritti", "settimana": "2026-11-23", "domanda": "La cessio bonorum:", "giusta": "permette al debitore di cedere i beni ai creditori evitando l'infamia", "sbagliate": ["è la vendita all'asta di tutto il patrimonio", "è la vendita frammentata per i senatori", "è l'esecuzione sulla persona"], "spiegazione": "La bonorum distractio, vendita frammentata, diventerà il modello."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "Che cosa distingue il negozio giuridico dal semplice atto lecito?", "giusta": "la volontà degli effetti", "sbagliate": ["è sempre scritto", "produce sempre un'obbligazione", "è sempre a titolo oneroso"], "spiegazione": "La volontà è diretta anche agli effetti, non solo all'atto. Il negozio è una costruzione dottrinale moderna."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "Il nuntius è:", "giusta": "chi riferisce la volontà altrui", "sbagliate": ["chi forma e manifesta la volontà per altri", "il garante del debitore", "il giudice privato"], "spiegazione": "Non la determina. Il rappresentante invece determina la volontà; Roma ammette di regola la rappresentanza indiretta."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "Quali sono i negozi formali tipici?", "giusta": "mancipatio, in iure cessio, stipulatio", "sbagliate": ["traditio, emptio venditio, locatio", "testamento, codicillo, fedecommesso", "mutuo, comodato, deposito"], "spiegazione": "Componenti: la parola e il gesto."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "Un negozio astratto:", "giusta": "prescinde dalla causa", "sbagliate": ["non produce effetti senza causa", "è sempre a causa di morte", "non ha forma"], "spiegazione": "Produce effetti a prescindere dalla causa, che non emerge dall'atto. Astrazione e formalismo vanno insieme; contro l'assenza di causa il pretore dà eccezioni."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "Una caratteristica dei negozi mortis causa è:", "giusta": "sono revocabili", "sbagliate": ["sono sempre formali", "non tollerano condizioni", "sono sempre a titolo oneroso"], "spiegazione": "Dagli appunti, Cap. IV · Il negozio giuridico."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "La condizione è:", "giusta": "un evento futuro e incerto da cui dipendono gli effetti", "sbagliate": ["un evento futuro e certo", "un onere imposto al beneficiario", "un evento passato ignoto alle parti"], "spiegazione": "Futuro e certo è il termine; l'onere è il modus."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "«Ti darò cento se vorrai» è una condizione:", "giusta": "meramente potestativa", "sbagliate": ["casuale, legata al caso", "potestativa, e valida", "mista fra volontà e caso"], "spiegazione": "Ha effetti invalidanti. Potestativa: se andrai sul Campidoglio; mista: se sposerai Mevia."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "Una condizione impossibile apposta a un testamento:", "giusta": "si considera non scritta (secondo i Sabiniani)", "sbagliate": ["rende nullo il testamento", "rende il testamento annullabile", "sospende il testamento per sempre"], "spiegazione": "Nei negozi fra vivi ha invece effetto invalidante."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "Il modus:", "giusta": "un onere che non condiziona l'acquisto", "sbagliate": ["fa cessare gli effetti a una data", "fa dipendere gli effetti da un evento incerto", "è la forma del negozio"], "spiegazione": "Impone un onere al beneficiario di una liberalità senza subordinarvi l'acquisto. Es. lascito con l'obbligo di erigere un monumento."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "Un termine «certo nel suo verificarsi ma incerto nel momento» è:", "giusta": "un termine", "sbagliate": ["una condizione sospensiva", "una condizione risolutiva", "un modus"], "spiegazione": "Un termine (dies), non una condizione. Se è incerto se l'evento accadrà, è condizione."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "Come nasce la distinzione fra nullità e annullabilità?", "giusta": "dalla fusione civile-pretorio", "sbagliate": ["da una legge di Augusto", "dalle XII tavole", "dalla legge delle citazioni"], "spiegazione": "Dalla fusione di diritto civile e diritto pretorio. Per lo ius civile il negozio era solo valido o invalido."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "Tizio dice di vendere uno schiavo, io capisco che me lo dona. È un:", "giusta": "error in negotio, che rende invalido il negozio", "sbagliate": ["error in nomine, irrilevante", "error in qualitate, irrilevante", "error in causa, irrilevante"], "spiegazione": "Dagli appunti, Cap. IV · Il negozio giuridico."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "L'error in nomine:", "giusta": "irrilevante se l'oggetto è identificato", "sbagliate": ["rende sempre nullo il negozio", "è rilevante solo nei negozi mortis causa", "comporta l'annullabilità"], "spiegazione": "È irrilevante se la persona o la cosa è comunque identificata. Dagli appunti, Cap. IV · Il negozio giuridico."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "L'error in qualitate è:", "giusta": "irrilevante", "sbagliate": ["sempre rilevante", "rilevante solo nei testamenti", "causa di nullità assoluta"], "spiegazione": "Irrilevante, perché chi compra può accertare la qualità. Per l'error in substantia prevalse invece l'idea della rilevanza."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "L'actio quod metus causa è:", "giusta": "un'azione penale nel quadruplo", "sbagliate": ["un'azione nel doppio contro il dolo", "l'eccezione della vittima che non ha ancora adempiuto", "un interdetto restitutorio"], "spiegazione": "Un'azione penale nel quadruplo contro chi ha usato violenza morale. La vittima che non ha adempiuto usa l'exceptio quod metus causa."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "Chi è stato raggirato ma non ha ancora pagato, come si difende?", "giusta": "con l'exceptio doli", "sbagliate": ["con l'actio de dolo subito", "con la restitutio in integrum soltanto", "non ha rimedi"], "spiegazione": "Con l'exceptio doli quando l'altro agisce per il pagamento. L'actio de dolo serve a chi ha già adempiuto e subito il danno."}, {"tema": "Cap. IV · Il negozio giuridico", "settimana": "2026-11-23", "domanda": "L'exceptio doli è «in personam» perché:", "giusta": "conta solo il dolo dell'attore", "sbagliate": ["si oppone solo contro i cittadini", "vale solo nelle azioni in personam", "la decide il pretore"], "spiegazione": "Rileva solo il dolo dell'attore, non quello di terzi. Il dolo è ritenuto meno grave della violenza."}]};
const D = DATI.domande.map(d=>({...d,id:d.domanda}));
const PER_ID = Object.fromEntries(D.map(d=>[d.id,d]));
const ULTIMA = D.map(d=>d.settimana||"").sort().pop()||"";
const NUOVE = ULTIMA?D.filter(d=>d.settimana===ULTIMA):[];
const TEMI = [...new Set(D.map(d=>d.tema))];
const CHIAVE = "quiz-diritto-romano-errori";
const app = document.getElementById("app");
let giro = null;

function leggiErrori(){ try{ return JSON.parse(localStorage.getItem(CHIAVE)||"[]"); }catch(e){ return []; } }
function scriviErrori(a){ try{ localStorage.setItem(CHIAVE, JSON.stringify(a)); }catch(e){} }
function mescola(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function home(){
  giro = null;
  const err = leggiErrori().filter(id=>PER_ID[id]);
  app.innerHTML = `
    <h1>${esc(DATI.materia)}</h1>
    <p class="sub">${esc(DATI.titolo)}: ${D.length} domande a risposta chiusa prese dal riassunto. Dopo ogni risposta vedi quella giusta e il perché.</p>
    <div class="modi">
      <button class="modo principale" data-m="sim"><div><b>Simulazione</b><span>30 domande a caso da tutti gli argomenti</span></div><span>→</span></button>
      ${NUOVE.length && NUOVE.length<D.length?`<button class="modo" data-m="nuove"><div><b>Questa settimana</b><span>le domande aggiunte il ${esc(ULTIMA.split("-").reverse().join("/"))}</span></div><span>${NUOVE.length}</span></button>`:""}
      <button class="modo" data-m="tutte"><div><b>Tutte le domande</b><span>in ordine casuale</span></div><span>${D.length}</span></button>
      <button class="modo" data-m="err" ${err.length?"":"disabled"}><div><b>Ripassa gli errori</b><span>${err.length?"le domande sbagliate finora":"ancora nessun errore salvato"}</span></div><span>${err.length||""}</span></button>
    </div>
    <h2>Per argomento</h2>
    <div class="temi">${TEMI.map((t,i)=>`<button class="tema" data-t="${i}"><span>${esc(t)}</span><small>${D.filter(d=>d.tema===t).length} domande</small></button>`).join("")}</div>`;
  app.querySelectorAll(".modo").forEach(b=>b.onclick=()=>{
    const m=b.dataset.m;
    if(m==="sim") inizia(mescola(D).slice(0,30),"Simulazione");
    if(m==="tutte") inizia(mescola(D),"Tutte le domande");
    if(m==="nuove") inizia(mescola(NUOVE),"Questa settimana");
    if(m==="err") inizia(mescola(leggiErrori().filter(id=>PER_ID[id]).map(id=>PER_ID[id])),"Ripasso degli errori");
  });
  app.querySelectorAll(".tema").forEach(b=>b.onclick=()=>{ const t=TEMI[+b.dataset.t]; inizia(mescola(D.filter(d=>d.tema===t)),t); });
  window.scrollTo(0,0);
}

function inizia(lista,nome){
  giro = {lista:lista.map(d=>({d,opz:mescola([d.giusta,...d.sbagliate])})), nome, i:0, giuste:0, sbagliate:[]};
  mostra();
}

function mostra(){
  const g=giro, q=g.lista[g.i], n=g.lista.length;
  app.innerHTML = `
    <div class="testa"><span>${esc(g.nome)}</span><span>${g.i+1} / ${n} · ${g.giuste} giuste</span></div>
    <div class="barra"><i style="width:${(g.i)/n*100}%"></i></div>
    <div class="card">
      <span class="etichetta">${esc(q.d.tema)}</span>
      <p class="domanda">${esc(q.d.domanda)}</p>
      <div class="opzioni">${q.opz.map((o,k)=>`<button class="opz" data-k="${k}"><span class="l">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="esito"></div>
    </div>
    <div class="azioni"><button class="btn sec" id="esci">Torna all'inizio</button><span></span></div>`;
  app.querySelectorAll(".opz").forEach(b=>b.onclick=()=>rispondi(+b.dataset.k));
  document.getElementById("esci").onclick=home;
  window.scrollTo(0,0);
}

function rispondi(k){
  const g=giro, q=g.lista[g.i];
  if(q.data!==undefined) return;
  q.data=k;
  const scelta=q.opz[k], ok=scelta===q.d.giusta;
  const err=new Set(leggiErrori());
  if(ok){ g.giuste++; err.delete(q.d.id); } else { g.sbagliate.push({q,scelta}); err.add(q.d.id); }
  scriviErrori([...err]);
  app.querySelectorAll(".opz").forEach(b=>{
    b.disabled=true; const o=q.opz[+b.dataset.k];
    if(o===q.d.giusta) b.classList.add("giusta"); else if(+b.dataset.k===k) b.classList.add("sbagliata");
  });
  const sp=q.d.spiegazione?`<div>${esc(q.d.spiegazione)}</div>`:"";
  document.getElementById("esito").innerHTML = ok
    ? `<div class="esito ok"><b>Giusto</b>${sp}</div>`
    : `<div class="esito ko"><b>Sbagliato. Era: ${esc(q.d.giusta)}</b>${sp}</div>`;
  const ultima=g.i===g.lista.length-1;
  const az=app.querySelector(".azioni span");
  az.outerHTML=`<button class="btn" id="avanti">${ultima?"Vedi il risultato":"Avanti →"}</button>`;
  document.getElementById("avanti").onclick=()=>{ if(ultima) fine(); else { g.i++; mostra(); } };
  document.getElementById("avanti").focus({preventScroll:true});
  app.querySelector(".testa span:last-child").textContent=`${g.i+1} / ${g.lista.length} · ${g.giuste} giuste`;
}

function fine(){
  const g=giro, n=g.lista.length, pct=Math.round(g.giuste/n*100);
  const giudizio = pct>=90?"Ottimo.":pct>=75?"Buono: ripassa le poche sbagliate.":pct>=60?"Sufficiente: guarda bene gli errori qui sotto.":"Da ripassare: rileggi gli argomenti delle domande sbagliate.";
  app.innerHTML = `
    <div class="card">
      <div class="testa"><span>${esc(g.nome)}</span><span>finito</span></div>
      <div class="punti">${g.giuste} / ${n}</div>
      <p class="voto">${pct}% di risposte giuste. ${giudizio}</p>
      ${g.sbagliate.length?`<h2>Le domande sbagliate</h2>`+g.sbagliate.map(({q,scelta})=>`
        <div class="errore"><p><b>${esc(q.d.domanda)}</b></p>
        <p class="tua">Hai risposto: ${esc(scelta)}</p>
        <p class="ok">Giusta: ${esc(q.d.giusta)}</p>
        ${q.d.spiegazione?`<p class="sp">${esc(q.d.spiegazione)}</p>`:""}</div>`).join(""):""}
    </div>
    <div class="azioni">
      <button class="btn sec" id="casa">Torna all'inizio</button>
      ${g.sbagliate.length?`<button class="btn" id="rifai">Rifai le sbagliate</button>`:`<button class="btn" id="nuova">Nuova simulazione</button>`}
    </div>`;
  document.getElementById("casa").onclick=home;
  const r=document.getElementById("rifai"); if(r) r.onclick=()=>inizia(mescola(g.sbagliate.map(s=>s.q.d)),"Rifai le sbagliate");
  const nu=document.getElementById("nuova"); if(nu) nu.onclick=()=>inizia(mescola(D).slice(0,30),"Simulazione");
  window.scrollTo(0,0);
}

document.addEventListener("keydown",e=>{
  if(!giro||!app.querySelector(".opz")) return;
  const k="1234".indexOf(e.key), kl="abcd".indexOf(e.key.toLowerCase());
  const q=giro.lista[giro.i];
  if(q && q.data===undefined && (k>=0||kl>=0)){ rispondi(k>=0?k:kl); e.preventDefault(); }
  else if(e.key==="Enter"){ const a=document.getElementById("avanti"); if(a){ a.click(); e.preventDefault(); } }
});

home();
</script>
</body>
</html>
